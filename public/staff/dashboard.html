<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スタッフダッシュボード</title>
<style>
  /* ============================================================
     GAS版 staff_dashboard.html（📋予約確認・📅シフト管理の2タブ構成）の
     Node移植版。GAS版は独自のグラデーション配色だったが、他の管理画面
     （owner_ui.html移植分）と使用感を揃えるため、既存のクリーム＋セージ
     配色トークンに合わせてある（色以外の構成・タブ分けはGAS版を踏襲）。
     ============================================================ */
  :root{
    --bg:#F5F4EF; --panel:#ffffff; --ink:#2B2B27; --ink-soft:#75746C; --ink-faint:#A9A79C;
    --line:#E4E2D9; --accent:#3D6B5C; --accent-soft:#E7EFE9; --warn:#B3542E; --warn-soft:#F7E9E2;
    --rose:#d4a5a5; --rose-dark:#c99aa4;
    --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0; font-family:'Hiragino Sans','Yu Gothic',sans-serif;}
  body{background:var(--bg); color:var(--ink);}
  .shell{display:none; min-height:100vh;}
  .shell.ready{display:block;}

  .header{background:linear-gradient(135deg, var(--rose) 0%, var(--rose-dark) 100%); color:#fff; padding:18px 20px;}
  .header-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;}
  .header-top h1{font-size:17px; font-weight:700;}
  .header-user{font-size:12.5px; text-align:right; line-height:1.5;}
  .header-sub{font-size:12px; opacity:0.9;}
  .proto-badge{display:inline-block; font-size:10px; font-weight:700; background:rgba(255,255,255,0.25); border-radius:6px; padding:2px 7px; margin-left:6px;}

  .tabs{display:flex; background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5;}
  .tab{flex:1; padding:13px; background:none; border:none; cursor:pointer; font-family:inherit; font-size:13.5px; font-weight:600; color:var(--ink-soft);}
  .tab.active{color:var(--rose-dark); border-bottom:3px solid var(--rose-dark);}

  .main{padding:18px 16px; max-width:720px; margin:0 auto;}
  .tab-content{display:none;}
  .tab-content.active{display:block;}

  .week-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .week-nav button{padding:8px 14px; border:1px solid var(--line); border-radius:9px; background:#fff; cursor:pointer; font-family:inherit; font-size:12.5px; color:var(--accent); font-weight:600;}
  .week-nav .label{font-size:13.5px; font-weight:700;}

  .day-block{margin-bottom:14px;}
  .day-block .day-label{font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; padding-left:2px;}
  .day-block .day-label.today{color:var(--rose-dark);}
  .day-block .day-label .dow-sun{color:#C0392B;} .day-block .day-label .dow-sat{color:#2980B9;}

  .card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:8px;}
  .card.cancelled{opacity:0.55;}
  .card .row1{display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;}
  .card .time{font-size:14px; font-weight:700; color:var(--accent);}
  .card .menu{font-size:12px; color:var(--ink-soft);}
  .card .customer{font-size:13.5px; font-weight:600;}
  .card .badge-cancel{font-size:10.5px; color:var(--warn); background:var(--warn-soft); border-radius:6px; padding:2px 6px; font-weight:700;}
  .card .note{font-size:11.5px; color:var(--ink-faint); margin-top:4px;}

  .shift-card{background:var(--accent-soft); color:var(--accent); border-radius:10px; padding:10px 14px; font-size:13.5px; font-weight:700; margin-bottom:8px;}

  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px;}
  .cal-dow{font-size:11px; font-weight:700; color:var(--ink-soft); text-align:center; padding-bottom:4px;}
  .cal-dow.dow-sun{color:#C0392B;} .cal-dow.dow-sat{color:#2980B9;}
  .cal-cell{position:relative; aspect-ratio:1/1; border:1px solid var(--line); border-radius:9px; background:#fff; padding:4px; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:flex-start;}
  .cal-cell.blank{visibility:hidden; cursor:default;}
  .cal-cell.today{border-color:var(--rose-dark); border-width:2px;}
  .cal-cell .num{font-size:12px; font-weight:700;}
  .cal-cell .num.dow-sun{color:#C0392B;} .cal-cell .num.dow-sat{color:#2980B9;}
  .cal-cell .cnt{margin-top:3px; font-size:10.5px; font-weight:700; color:#fff; background:var(--accent); border-radius:8px; padding:1px 6px; min-width:16px; text-align:center;}
  .cal-cell .pending-dot{position:absolute; top:3px; right:5px; width:7px; height:7px; border-radius:50%; background:var(--warn);}

  .empty{color:var(--ink-faint); font-size:12.5px; text-align:center; padding:18px 0;}
  #loadingMsg{text-align:center; color:var(--ink-soft); font-size:13px; padding:60px 0;}
  .footer-nav{text-align:center; padding:18px 0 30px;}
  .footer-nav a{font-size:12px; color:var(--ink-soft); text-decoration:none;}

  .section-title{font-size:13px; font-weight:700; color:var(--ink-soft); margin:2px 0 8px;}
  .shift-add-btn{width:100%; padding:10px; border:1px dashed var(--rose-dark); border-radius:10px; background:#fff; color:var(--rose-dark); font-weight:700; font-size:13px; cursor:pointer; margin-bottom:14px;}
  .shift-card{cursor:pointer;}
  .modal-overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:50; align-items:center; justify-content:center; padding:16px;}
  .modal-overlay.open{display:flex;}
  .modal-box{background:#fff; border-radius:14px; padding:18px; width:100%; max-width:340px;}
  .modal-title{font-size:15px; font-weight:700; margin-bottom:14px;}
  .modal-field{margin-bottom:12px;}
  .modal-label{font-size:12px; color:var(--ink-soft); margin-bottom:4px; font-weight:600;}
  .modal-field input{width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; font-family:inherit; font-size:13.5px;}
  .modal-msg{font-size:12px; color:var(--warn); margin-bottom:8px; min-height:14px;}
  .modal-actions{display:flex; gap:8px; margin-top:14px;}
  .modal-btn{flex:1; padding:10px; border-radius:9px; border:none; font-weight:700; font-size:13px; cursor:pointer; font-family:inherit;}
  .modal-btn-cancel{background:#f0efe9; color:var(--ink-soft);}
  .modal-btn-ok{background:var(--rose-dark); color:#fff;}
  .modal-btn-delete{width:100%; margin-top:10px; padding:10px; background:var(--warn-soft); color:var(--warn); border:1px solid #e9b3b3; border-radius:9px; font-weight:700; font-size:13px; cursor:pointer; font-family:inherit;}
</style>
</head>
<body>
  <div id="loadingMsg">読み込み中...</div>

  <div class="shell" id="shell">
    <div class="header">
      <div class="header-top">
        <h1>🧑‍🤝‍🧑 スタッフダッシュボード<span class="proto-badge">PROTOTYPE</span></h1>
        <div class="header-user">
          <div id="headerStaffName"></div>
        </div>
      </div>
      <div class="header-sub" id="headerStoreName"></div>
    </div>

    <div class="tabs">
      <button class="tab active" id="tabResBtn" type="button">📋 予約確認</button>
      <button class="tab" id="tabShiftBtn" type="button">📅 シフト管理</button>
      <button class="tab" id="tabCalBtn" type="button">📆 月間カレンダー</button>
    </div>

    <div class="main">
      <div class="tab-content active" id="tabRes">
        <div class="section-title">📋 直近の予約</div>
        <div id="upcomingList" style="margin-bottom:18px;"></div>

        <div class="week-nav">
          <button id="resPrevBtn" type="button">← 前週</button>
          <div class="label" id="resWeekLabel"></div>
          <button id="resNextBtn" type="button">次週 →</button>
        </div>
        <div id="resList"></div>
      </div>

      <div class="tab-content" id="tabShift">
        <button class="shift-add-btn" id="shiftAddOpenBtn" type="button">＋ シフトを追加</button>
        <div class="week-nav">
          <button id="shiftPrevBtn" type="button">← 前週</button>
          <div class="label" id="shiftWeekLabel"></div>
          <button id="shiftNextBtn" type="button">次週 →</button>
        </div>
        <div id="shiftList"></div>
      </div>

      <div class="tab-content" id="tabCal">
        <div class="week-nav">
          <button id="calPrevBtn" type="button">← 前月</button>
          <div class="label" id="calMonthLabel"></div>
          <button id="calNextBtn" type="button">次月 →</button>
        </div>
        <div class="cal-grid" id="calGrid"></div>
        <div class="empty" style="margin-top:10px;">日付をタップすると📋予約確認タブでその週を表示します</div>
      </div>

      <div class="footer-nav"><a href="#" id="logoutLink">🚪 ログアウト</a></div>
    </div>
  </div>

  <!-- ＋ シフトを追加 モーダル -->
  <div class="modal-overlay" id="shiftAddModal">
    <div class="modal-box">
      <div class="modal-title">＋ シフトを追加</div>
      <div class="modal-msg" id="shiftAddMsg"></div>
      <div class="modal-field">
        <div class="modal-label">日付</div>
        <input type="date" id="addDate">
      </div>
      <div class="modal-field">
        <div class="modal-label">開始時間</div>
        <input type="time" id="addStart" value="10:00">
      </div>
      <div class="modal-field">
        <div class="modal-label">終了時間</div>
        <input type="time" id="addEnd" value="19:00">
      </div>
      <div class="modal-actions">
        <button class="modal-btn modal-btn-cancel" id="shiftAddCancelBtn" type="button">キャンセル</button>
        <button class="modal-btn modal-btn-ok" id="shiftAddSaveBtn" type="button">追加する</button>
      </div>
    </div>
  </div>

  <!-- ✏️ シフトを変更 モーダル -->
  <div class="modal-overlay" id="shiftEditModal">
    <div class="modal-box">
      <div class="modal-title">✏️ シフトを変更</div>
      <div class="modal-msg" id="shiftEditMsg"></div>
      <div class="modal-field">
        <div class="modal-label" id="shiftEditDateLabel"></div>
      </div>
      <div class="modal-field">
        <div class="modal-label">開始時間</div>
        <input type="time" id="editStart">
      </div>
      <div class="modal-field">
        <div class="modal-label">終了時間</div>
        <input type="time" id="editEnd">
      </div>
      <div class="modal-actions">
        <button class="modal-btn modal-btn-cancel" id="shiftEditCancelBtn" type="button">キャンセル</button>
        <button class="modal-btn modal-btn-ok" id="shiftEditSaveBtn" type="button">保存する</button>
      </div>
      <button class="modal-btn-delete" id="shiftEditDeleteBtn" type="button">🗑️ このシフトを削除する</button>
    </div>
  </div>

<script>
(function(){
  const loadingMsg = document.getElementById('loadingMsg');
  const shell = document.getElementById('shell');
  let resWeekStart = startOfWeek(new Date());
  let shiftWeekStart = startOfWeek(new Date());
  let calMonth = new Date(); calMonth.setDate(1); calMonth.setHours(0,0,0,0);

  function startOfWeek(d) {
    const x = new Date(d); x.setHours(0,0,0,0);
    const dow = (x.getDay() + 6) % 7; // 0=月曜始まり
    x.setDate(x.getDate() - dow);
    return x;
  }
  function fmt(d) {
    const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate()+n); return x; }
  const DOW_LABELS = ['月','火','水','木','金','土','日'];
  function dowClass(jsDay) { return jsDay === 0 ? 'dow-sun' : (jsDay === 6 ? 'dow-sat' : ''); }
  function todayStr() { return fmt(new Date()); }

  async function staffFetch(url) {
    const res = await fetch(url);
    if (res.status === 401) throw new Error('UNAUTHORIZED');
    if (!res.ok) throw new Error('サーバーエラー: ' + res.status);
    return res.json();
  }

  async function init() {
    try {
      const me = await staffFetch('/api/auth/me');
      document.getElementById('headerStaffName').textContent = me.staff.name + (me.staff.isOwner ? '（オーナー）' : '');
      const storeData = await staffFetch('/api/store');
      document.getElementById('headerStoreName').textContent = storeData.store.name;
      await loadUpcoming();
      await loadReservations();
      await loadShifts();
      await loadCalendar();
      loadingMsg.style.display = 'none';
      shell.classList.add('ready');
    } catch (e) {
      // ★他の管理画面と同じく、セッション切れ時は元居たこのページへ戻れるよう
      //   next パラメータを付ける
      window.location.href = '/admin/login.html?next=' + encodeURIComponent(window.location.pathname);
    }
  }

  // ---- 📋 直近の予約（GAS版dashboard_functions.gs getUpcomingReservationsの移植） ----
  async function loadUpcoming() {
    const el = document.getElementById('upcomingList');
    try {
      const data = await staffFetch('/api/staff/reservations/upcoming');
      const rows = data.reservations || [];
      if (rows.length === 0) {
        el.innerHTML = `<div class="empty">今後${data.rangeDays || 15}日以内の担当予約はありません</div>`;
        return;
      }
      el.innerHTML = '';
      rows.forEach((r) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="row1">
            <span class="time">${r.reservation_date} ${r.reservation_time}〜</span>
            ${r.status === '仮予約' ? '<span class="badge-cancel">仮予約</span>' : ''}
          </div>
          <div class="customer">${r.realname}</div>
          <div class="menu">${r.menu || ''}</div>
        `;
        el.appendChild(card);
      });
    } catch (e) {
      el.innerHTML = '<div class="empty">読み込みに失敗しました</div>';
    }
  }

  // ---- 📋 予約確認タブ ----
  async function loadReservations() {
    const from = fmt(resWeekStart);
    const to = fmt(addDays(resWeekStart, 6));
    document.getElementById('resWeekLabel').textContent = `${from} 〜 ${to}`;
    const data = await staffFetch(`/api/staff/reservations?from=${from}&to=${to}`);

    const byDate = {};
    (data.reservations || []).forEach((r) => {
      (byDate[r.reservation_date] = byDate[r.reservation_date] || []).push(r);
    });

    const listEl = document.getElementById('resList');
    listEl.innerHTML = '';
    let any = false;
    for (let i = 0; i < 7; i++) {
      const d = addDays(resWeekStart, i);
      const dStr = fmt(d);
      const rows = (byDate[dStr] || []).sort((a, b) => a.reservation_time.localeCompare(b.reservation_time));
      if (rows.length === 0) continue;
      any = true;
      const block = document.createElement('div');
      block.className = 'day-block';
      const isToday = dStr === todayStr();
      block.innerHTML = `<div class="day-label${isToday ? ' today' : ''}">${dStr}（<span class="${dowClass(d.getDay())}">${DOW_LABELS[i]}</span>）${isToday ? ' ・本日' : ''}</div>`;
      rows.forEach((r) => {
        const cancelled = r.realname === 'キャンセル';
        const card = document.createElement('div');
        card.className = 'card' + (cancelled ? ' cancelled' : '');
        card.innerHTML = `
          <div class="row1">
            <span class="time">${r.reservation_time}〜</span>
            ${cancelled ? '<span class="badge-cancel">キャンセル</span>' : ''}
          </div>
          <div class="customer">${cancelled ? (r.kana || '（顧客名不明）') : r.realname}</div>
          <div class="menu">${r.menu || ''}</div>
          ${r.note ? `<div class="note">${r.note}</div>` : ''}
        `;
        block.appendChild(card);
      });
      listEl.appendChild(block);
    }
    if (!any) {
      listEl.innerHTML = '<div class="empty">この週に担当の予約はありません</div>';
    }
  }

  // ---- 📅 シフト管理タブ（自分のシフトの閲覧のみ。追加・削除はオーナー管理画面から） ----
  async function loadShifts() {
    const from = fmt(shiftWeekStart);
    const to = fmt(addDays(shiftWeekStart, 6));
    document.getElementById('shiftWeekLabel').textContent = `${from} 〜 ${to}`;
    const data = await staffFetch(`/api/staff/shifts?from=${from}&to=${to}`);

    const byDate = {};
    (data.shifts || []).forEach((s) => {
      (byDate[s.shift_date] = byDate[s.shift_date] || []).push(s);
    });

    const listEl = document.getElementById('shiftList');
    listEl.innerHTML = '';
    let any = false;
    for (let i = 0; i < 7; i++) {
      const d = addDays(shiftWeekStart, i);
      const dStr = fmt(d);
      const rows = byDate[dStr] || [];
      const isToday = dStr === todayStr();
      const block = document.createElement('div');
      block.className = 'day-block';
      block.innerHTML = `<div class="day-label${isToday ? ' today' : ''}">${dStr}（<span class="${dowClass(d.getDay())}">${DOW_LABELS[i]}</span>）${isToday ? ' ・本日' : ''}</div>`;
      if (rows.length > 0) {
        any = true;
        rows.forEach((s) => {
          const card = document.createElement('div');
          card.className = 'shift-card';
          card.textContent = `${s.start_time} 〜 ${s.end_time}`;
          card.addEventListener('click', () => openShiftEditModal(s, dStr));
          block.appendChild(card);
        });
        listEl.appendChild(block);
      }
    }
    if (!any) {
      listEl.innerHTML = '<div class="empty">この週の出勤シフトは登録されていません</div>';
    }
  }

  // ---- 📆 月間カレンダータブ ----
  async function loadCalendar() {
    const monthStr = `${calMonth.getFullYear()}-${String(calMonth.getMonth()+1).padStart(2,'0')}`;
    document.getElementById('calMonthLabel').textContent = `${calMonth.getFullYear()}年${calMonth.getMonth()+1}月`;
    const data = await staffFetch(`/api/staff/reservations/monthly?month=${monthStr}`);
    const counts = data.counts || {};

    const gridEl = document.getElementById('calGrid');
    gridEl.innerHTML = '';
    DOW_LABELS.forEach((label, i) => {
      const dow = document.createElement('div');
      dow.className = 'cal-dow ' + (i === 5 ? 'dow-sat' : (i === 6 ? 'dow-sun' : ''));
      dow.textContent = label;
      gridEl.appendChild(dow);
    });

    const firstOfMonth = new Date(calMonth.getFullYear(), calMonth.getMonth(), 1);
    const leadBlanks = (firstOfMonth.getDay() + 6) % 7; // 月曜始まり
    const daysInMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 0).getDate();
    const tStr = todayStr();

    for (let i = 0; i < leadBlanks; i++) {
      const blank = document.createElement('div');
      blank.className = 'cal-cell blank';
      gridEl.appendChild(blank);
    }
    for (let d = 1; d <= daysInMonth; d++) {
      const date = new Date(calMonth.getFullYear(), calMonth.getMonth(), d);
      const dStr = fmt(date);
      const info = counts[dStr];
      const cell = document.createElement('div');
      cell.className = 'cal-cell' + (dStr === tStr ? ' today' : '');
      cell.innerHTML = `<span class="num ${dowClass(date.getDay())}">${d}</span>` +
        (info && info.count > 0 ? `<span class="cnt">${info.count}</span>` : '') +
        (info && info.pending ? '<span class="pending-dot" title="仮予約あり"></span>' : '');
      cell.addEventListener('click', () => {
        resWeekStart = startOfWeek(date);
        loadReservations();
        switchTab('tabResBtn', 'tabRes');
      });
      gridEl.appendChild(cell);
    }
  }

  // ---- シフト追加・変更・削除モーダル（GAS版staff_dashboard.htmlの
  //   ①シフト追加モーダル・②シフト編集モーダル相当。自分自身のシフトのみ対象） ----
  let _editingShiftId = null;

  function openShiftAddModal() {
    document.getElementById('shiftAddMsg').textContent = '';
    document.getElementById('addDate').value = fmt(shiftWeekStart);
    document.getElementById('addStart').value = '10:00';
    document.getElementById('addEnd').value = '19:00';
    document.getElementById('shiftAddModal').classList.add('open');
  }
  function closeShiftAddModal() {
    document.getElementById('shiftAddModal').classList.remove('open');
  }
  async function submitShiftAdd() {
    const msgEl = document.getElementById('shiftAddMsg');
    msgEl.textContent = '';
    const date = document.getElementById('addDate').value;
    const startTime = document.getElementById('addStart').value;
    const endTime = document.getElementById('addEnd').value;
    if (!date || !startTime || !endTime) { msgEl.textContent = '日付・時間を入力してください'; return; }
    try {
      const res = await fetch('/api/staff/shifts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ date, startTime, endTime })
      });
      const data = await res.json();
      if (!data.success) { msgEl.textContent = data.message || '追加に失敗しました'; return; }
      closeShiftAddModal();
      await loadShifts();
    } catch (e) {
      msgEl.textContent = '通信エラーが発生しました';
    }
  }

  function openShiftEditModal(shift, dStr) {
    _editingShiftId = shift.id;
    document.getElementById('shiftEditMsg').textContent = '';
    document.getElementById('shiftEditDateLabel').textContent = `${dStr}（${shift.start_time} 〜 ${shift.end_time}）`;
    document.getElementById('editStart').value = shift.start_time;
    document.getElementById('editEnd').value = shift.end_time;
    document.getElementById('shiftEditModal').classList.add('open');
  }
  function closeShiftEditModal() {
    document.getElementById('shiftEditModal').classList.remove('open');
    _editingShiftId = null;
  }
  async function submitShiftEdit() {
    const msgEl = document.getElementById('shiftEditMsg');
    msgEl.textContent = '';
    const startTime = document.getElementById('editStart').value;
    const endTime = document.getElementById('editEnd').value;
    if (!startTime || !endTime) { msgEl.textContent = '時間を入力してください'; return; }
    try {
      const res = await fetch(`/api/staff/shifts/${_editingShiftId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ startTime, endTime })
      });
      const data = await res.json();
      if (!data.success) { msgEl.textContent = data.message || '変更に失敗しました'; return; }
      closeShiftEditModal();
      await loadShifts();
    } catch (e) {
      msgEl.textContent = '通信エラーが発生しました';
    }
  }
  async function submitShiftDelete() {
    const msgEl = document.getElementById('shiftEditMsg');
    msgEl.textContent = '';
    try {
      const res = await fetch(`/api/staff/shifts/${_editingShiftId}`, { method: 'DELETE' });
      const data = await res.json();
      if (!data.success) { msgEl.textContent = data.message || '削除に失敗しました'; return; }
      closeShiftEditModal();
      await loadShifts();
    } catch (e) {
      msgEl.textContent = '通信エラーが発生しました';
    }
  }

  document.getElementById('shiftAddOpenBtn').addEventListener('click', openShiftAddModal);
  document.getElementById('shiftAddCancelBtn').addEventListener('click', closeShiftAddModal);
  document.getElementById('shiftAddSaveBtn').addEventListener('click', submitShiftAdd);
  document.getElementById('shiftEditCancelBtn').addEventListener('click', closeShiftEditModal);
  document.getElementById('shiftEditSaveBtn').addEventListener('click', submitShiftEdit);
  document.getElementById('shiftEditDeleteBtn').addEventListener('click', submitShiftDelete);

  function switchTab(btnId, contentId) {
    ['tabResBtn', 'tabShiftBtn', 'tabCalBtn'].forEach((id) => document.getElementById(id).classList.toggle('active', id === btnId));
    ['tabRes', 'tabShift', 'tabCal'].forEach((id) => document.getElementById(id).classList.toggle('active', id === contentId));
  }

  document.getElementById('tabResBtn').addEventListener('click', () => switchTab('tabResBtn', 'tabRes'));
  document.getElementById('tabShiftBtn').addEventListener('click', () => switchTab('tabShiftBtn', 'tabShift'));
  document.getElementById('tabCalBtn').addEventListener('click', () => switchTab('tabCalBtn', 'tabCal'));

  document.getElementById('resPrevBtn').addEventListener('click', () => { resWeekStart = addDays(resWeekStart, -7); loadReservations(); });
  document.getElementById('resNextBtn').addEventListener('click', () => { resWeekStart = addDays(resWeekStart, 7); loadReservations(); });
  document.getElementById('shiftPrevBtn').addEventListener('click', () => { shiftWeekStart = addDays(shiftWeekStart, -7); loadShifts(); });
  document.getElementById('shiftNextBtn').addEventListener('click', () => { shiftWeekStart = addDays(shiftWeekStart, 7); loadShifts(); });
  document.getElementById('calPrevBtn').addEventListener('click', () => { calMonth.setMonth(calMonth.getMonth() - 1); loadCalendar(); });
  document.getElementById('calNextBtn').addEventListener('click', () => { calMonth.setMonth(calMonth.getMonth() + 1); loadCalendar(); });

  document.getElementById('logoutLink').addEventListener('click', async (e) => {
    e.preventDefault();
    try { await fetch('/api/auth/logout', { method: 'POST' }); } catch (_) {}
    window.location.href = '/admin/login.html';
  });

  init();
})();
</script>
</body>
</html>
