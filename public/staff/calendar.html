<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>サロンダッシュボード</title>
<style>
  /* ============================================================
     GAS版 calendar_page.html（サロンダッシュボード＝週・月表示のカレンダー
     グリッドで店舗全体の予約を担当者色分け表示し、その場で予約の追加・
     編集・キャンセル、イベント（臨時休業等）の確認・管理ができる画面）の
     Node移植版。色以外は他の管理画面と使用感を揃えるクリーム＋セージの
     配色トークンに合わせてある。GAS版との差異はREADME_PROTOTYPE.md章44参照
     （週の開始曜日を月曜に統一・Googleカレンダー連携は対象外）。
     ★2026-09-23：スタッフ色はGAS版と同じくスタッフ毎に保存した色（スタッフ管理画面で
     オーナーが選択）を使う方式に変更。終日行事の帯表示・行事の前後ブロック時間帯の
     斜線表示もGAS版どおりに移植した（README章50参照）。
     ============================================================ */
  :root{
    --bg:#F5F4EF; --panel:#ffffff; --ink:#2B2B27; --ink-soft:#75746C; --ink-faint:#A9A79C;
    --line:#E4E2D9; --accent:#3D6B5C; --accent-soft:#E7EFE9; --warn:#B3542E; --warn-soft:#F7E9E2;
    --rose:#d4a5a5; --rose-dark:#c99aa4;
    --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0; font-family:'Hiragino Sans','Yu Gothic',sans-serif;}
  body{background:var(--bg); color:var(--ink);}
  .shell{display:none; min-height:100vh;}
  .shell.ready{display:block;}

  .header{background:linear-gradient(135deg, var(--rose) 0%, var(--rose-dark) 100%); color:#fff; padding:14px 16px;}
  .header-top{display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .header-top h1{font-size:16px; font-weight:700;}
  .header-top .back-link{font-size:12px; color:#fff; opacity:0.9; text-decoration:none; border:1px solid rgba(255,255,255,0.5); border-radius:8px; padding:4px 9px; white-space:nowrap;}
  .header-user{font-size:11.5px; opacity:0.9; margin-top:2px;}

  .toolbar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between; background:#fff; border-bottom:1px solid var(--line); padding:9px 12px; position:sticky; top:0; z-index:6;}
  .view-tog{display:flex; border:1px solid var(--line); border-radius:9px; overflow:hidden;}
  .view-tog button{padding:7px 14px; border:none; background:#fff; font-family:inherit; font-size:12.5px; font-weight:600; color:var(--ink-soft); cursor:pointer;}
  .view-tog button.active{background:var(--accent); color:#fff;}
  .nav-group{display:flex; align-items:center; gap:6px;}
  .nav-group button{padding:6px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; font-family:inherit; font-size:12px; color:var(--accent); font-weight:600; cursor:pointer;}
  .nav-label{font-size:13px; font-weight:700; min-width:120px; text-align:center;}

  .main{padding:12px; max-width:1100px; margin:0 auto;}

  /* ---- 週表示 ---- */
  .week-wrap{overflow-x:auto; background:#fff; border:1px solid var(--line); border-radius:var(--radius);}
  .week-grid{display:grid; grid-template-columns:44px repeat(7, minmax(96px,1fr)); min-width:760px;}
  .wk-head{position:sticky; top:0; background:#fff; z-index:2; border-bottom:1px solid var(--line); padding:6px 4px; text-align:center;}
  .wk-head.corner{border-right:1px solid var(--line);}
  .wk-head .dow{font-size:11px; color:var(--ink-soft);}
  .wk-head .dnum{font-size:14px; font-weight:700; margin-top:1px;}
  .wk-head .dnum.today{display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:50%; background:#E24B4A; color:#fff;}
  .wk-head.dow-sun .dow, .wk-head.dow-sun .dnum{color:#C62828;}
  .wk-head.dow-sat .dow, .wk-head.dow-sat .dnum{color:#1565C0;}
  .wk-head-evbtn{margin-top:2px; font-size:10px; color:var(--accent); cursor:pointer; border:1px solid var(--line); border-radius:6px; padding:1px 5px; display:inline-block;}

  .wk-hourcol{border-right:1px solid var(--line);}
  .wk-hour{height:44px; font-size:10px; color:var(--ink-faint); text-align:right; padding-right:4px; border-bottom:1px dashed var(--line); position:relative; top:-6px;}
  .wk-day{position:relative; border-right:1px solid var(--line); border-bottom:none;}
  .wk-day-inner{position:relative; height:660px;} /* 15時間（9:00〜23:59） x 44px */
  .wk-hourline{position:absolute; left:0; right:0; height:1px; background:var(--line);}
  .wk-slot-click{position:absolute; left:0; right:0; height:44px; cursor:pointer; z-index:1;}
  .wk-slot-click:hover{background:rgba(61,107,92,0.06);}

  .ev-blk{position:absolute; border-radius:6px; border-left:4px solid; padding:2px 5px; font-size:10.5px; line-height:1.35; overflow:hidden; cursor:pointer; box-shadow:0 1px 2px rgba(0,0,0,0.08); z-index:4;}
  .ev-blk .prov{color:#D32F2F; font-weight:700;}
  .ev-blk .nm{font-weight:700;}
  .ev-blk .opt{font-weight:400; font-size:9px; color:#666;}
  /* ★2026-09-23修正：GAS版calendar_page.html 93-98行と同じ重なり順・見た目に揃えた。
     以前は「終日」の行事が00:00〜23:59の縦長ブロックとして列全体を覆ってしまい、
     その日の予約が隠れて押せなくなる不具合があった */
  .ev-event{position:absolute; left:2px; right:2px; background:#D6D6D6; color:#333; border-top:3px solid #757575; border-radius:4px; padding:2px 5px; font-size:10px; cursor:pointer; overflow:hidden; z-index:3;}
  .ev-buffer{position:absolute; left:0; right:0; z-index:2; background:repeating-linear-gradient(45deg,#E6E6E6,#E6E6E6 8px,#CFCFCF 8px,#CFCFCF 16px); opacity:0.7; pointer-events:none;}
  .wk-day-inner.fullblock{background:#D6D6D6;}
  .ev-allday-wrap{position:absolute; top:0; left:0; right:0; z-index:5; display:flex; flex-direction:column; gap:1px;}
  .ev-allday-bar{font-size:10.5px; font-weight:600; padding:3px 5px; background:repeating-linear-gradient(45deg,#F5F5F5,#F5F5F5 8px,#E4E4E4 8px,#E4E4E4 16px); color:#555; border-bottom:2px solid #9E9E9E; cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .ev-allday-bar.is-blocked{background:#BDBDBD; color:#333; border-bottom:2px solid #757575;}
  .mevent-bar.is-blocked{background:#BDBDBD; color:#222;}

  /* ---- 月表示 ---- */
  .month-grid{display:grid; grid-template-columns:repeat(7,1fr); background:#fff; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
  .m-head{padding:6px 0; text-align:center; font-size:11.5px; font-weight:700; color:var(--ink-soft); background:var(--accent-soft); border-bottom:1px solid var(--line);}
  .m-head.dow-sun{color:#C62828;} .m-head.dow-sat{color:#1565C0;}
  .mday{min-height:88px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:4px; cursor:pointer; position:relative;}
  .mday:hover{background:rgba(61,107,92,0.05);}
  .mday.other{opacity:0.4; cursor:default;}
  .mday .dnum{font-size:12px; font-weight:700;}
  .mday .dnum.today{display:inline-flex; align-items:center; justify-content:center; width:19px; height:19px; border-radius:50%; background:#E24B4A; color:#fff;}
  .mday.dow-sun .dnum{color:#C62828;} .mday.dow-sat .dnum{color:#1565C0;}
  .mev{margin-top:2px; font-size:9.5px; padding:1px 4px; border-radius:4px; border-left:3px solid; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; cursor:pointer;}
  .mevent-bar{margin-top:2px; font-size:9px; padding:1px 4px; border-radius:4px; background:#EEEEEE; color:#424242; border-left:3px solid #757575; cursor:pointer;}
  .m-add-icon{position:absolute; top:2px; right:2px; font-size:10px; color:var(--accent); cursor:pointer;}
  .m-more{font-size:9px; color:var(--ink-faint); margin-top:2px;}

  .legend{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; font-size:11px; color:var(--ink-soft);}
  .legend .chip{display:inline-flex; align-items:center; gap:4px;}
  .legend .dot{width:9px; height:9px; border-radius:50%;}

  /* ---- モーダル共通 ---- */
  .modal-overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:50; align-items:center; justify-content:center; padding:16px;}
  .modal-overlay.show{display:flex;}
  .modal-box{background:#fff; border-radius:var(--radius); padding:18px; width:100%; max-width:380px; max-height:88vh; overflow-y:auto;}
  .modal-title{font-size:15px; font-weight:700; margin-bottom:10px;}
  .modal-field{margin-bottom:10px;}
  .modal-field label{display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:3px;}
  .modal-field input, .modal-field select{width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; font-family:inherit; font-size:13.5px;}
  .modal-field .chk-row{display:flex; align-items:center; gap:6px; font-weight:400; font-size:12.5px;}
  .modal-field .chk-row input{width:auto;}
  .modal-err{color:#c0392b; font-size:12px; margin:4px 0;}
  .modal-actions{display:flex; gap:8px; margin-top:12px;}
  .modal-btn-cancel, .modal-btn-ok, .modal-btn-danger{flex:1; padding:10px; border-radius:9px; border:none; font-family:inherit; font-size:13px; font-weight:700; cursor:pointer;}
  .modal-btn-cancel{background:#EFEEE8; color:var(--ink-soft);}
  .modal-btn-ok{background:var(--accent); color:#fff;}
  .modal-btn-danger{background:var(--warn); color:#fff;}
  /* ★2026-09-22：社長の指摘によりGAS版と同じ「かな行インデックス付きの全件ブラウズ」
     方式の顧客選択モーダルに変更した（以前はフリーテキストの部分一致検索だった） */
  .cust-pick-btn{width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; background:#fff; font-family:inherit; font-size:13.5px; font-weight:700; color:var(--accent); cursor:pointer; text-align:left;}
  .cust-pick-box{max-width:420px;}
  .kana-index{display:flex; flex-wrap:wrap; gap:5px; margin:10px 0;}
  .kana-index button{padding:6px 10px; border:1px solid var(--line); border-radius:7px; background:#fff; font-family:inherit; font-size:12.5px; cursor:pointer;}
  .kana-index button.active{background:var(--accent); color:#fff; border-color:var(--accent);}
  .cust-pick-list{max-height:340px; overflow-y:auto; border:1px solid var(--line); border-radius:8px;}
  .cust-pick-list .cust-row{padding:9px 10px; font-size:13px; cursor:pointer; border-bottom:1px solid var(--line);}
  .cust-pick-list .cust-row:last-child{border-bottom:none;}
  .cust-pick-list .cust-row:hover{background:var(--bg);}
  .cust-pick-list .cust-row .k{color:var(--ink-faint); font-size:11px; margin-left:6px;}
  .cust-pick-list .cust-empty{padding:10px; font-size:12.5px; color:var(--ink-faint);}
  .cust-selected{margin-top:5px; font-size:11.5px; color:var(--accent); font-weight:700;}
  .cust-hint{margin-top:4px; font-size:11px; color:var(--ink-faint);}
  .cust-new-toggle{margin-top:6px; background:none; border:none; padding:0; color:var(--accent); font-family:inherit; font-size:11.5px; font-weight:700; cursor:pointer; text-decoration:underline;}
  .cust-new-box{margin-top:8px; padding:10px; background:var(--bg); border-radius:9px;}
  .cust-keep-label{display:flex; align-items:center; gap:6px; font-size:12px; font-weight:400; margin-bottom:4px;}
  .cust-keep-label input{width:auto;}
  .menu-options{display:flex; flex-direction:column; gap:5px; max-height:120px; overflow-y:auto; border:1px solid var(--line); border-radius:8px; padding:8px 10px;}
  .menu-options label{display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:400;}
  .menu-options label input{width:auto;}
  .menu-options .empty{font-size:12px; color:var(--ink-faint);}

  .popup-row{font-size:13px; margin-bottom:6px; line-height:1.5;}
  .popup-row .k{color:var(--ink-soft); font-size:11px;}
  .popup-actions{display:flex; flex-direction:column; gap:7px; margin-top:12px;}
  .popup-actions button{padding:10px; border-radius:9px; border:1px solid var(--line); background:#fff; font-family:inherit; font-size:13px; font-weight:600; cursor:pointer;}
  .popup-actions .pa-edit{color:var(--accent); border-color:var(--accent);}
  .popup-actions .pa-cancel{color:var(--warn); border-color:var(--warn);}
  .popup-actions .pa-add{color:#fff; background:var(--accent); border-color:var(--accent);}

  .ev-list-item{display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-bottom:1px solid var(--line); font-size:12.5px;}
  .ev-list-item .ev-btns{display:flex; gap:6px;}
  .ev-list-item .ev-btns button{font-size:11px; padding:3px 7px; border-radius:6px; border:1px solid var(--line); background:#fff; cursor:pointer;}

  #loadingMsg{padding:40px; text-align:center; color:var(--ink-soft);}
</style>
</head>
<body>
  <div id="loadingMsg">読み込み中...</div>

  <div class="shell" id="shell">
    <div class="header">
      <div class="header-top">
        <h1>🛏️ サロンダッシュボード</h1>
        <div style="display:flex; gap:6px; align-items:center;">
          <a class="back-link" href="/staff/dashboard.html">← ダッシュボードへ</a>
          <a class="back-link" href="#" id="calLogoutLink">ログアウト</a>
        </div>
      </div>
      <div class="header-user" id="headerInfo"></div>
    </div>

    <div class="toolbar">
      <div class="view-tog">
        <button id="viewWeekBtn" type="button" class="active">週</button>
        <button id="viewMonthBtn" type="button">月</button>
      </div>
      <div class="nav-group">
        <button id="navPrevBtn" type="button">← 前</button>
        <button id="navTodayBtn" type="button">今日</button>
        <button id="navNextBtn" type="button">次 →</button>
      </div>
      <div class="nav-label" id="navLabel"></div>
      <button id="reloadBtn" type="button" style="padding:6px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; cursor:pointer;">🔄</button>
    </div>

    <div class="main">
      <div id="weekView" class="week-wrap"></div>
      <div id="monthView" class="month-grid" style="display:none;"></div>

      <div class="legend" id="legend"></div>
    </div>
  </div>

  <!-- 予約詳細ポップアップ -->
  <div class="modal-overlay" id="resPopup">
    <div class="modal-box">
      <div class="modal-title" id="rpTitle">予約の詳細</div>
      <div class="popup-row"><span class="k">日時：</span><span id="rpDatetime"></span></div>
      <div class="popup-row"><span class="k">担当：</span><span id="rpStaff"></span></div>
      <div class="popup-row"><span class="k">メニュー：</span><span id="rpMenu"></span></div>
      <div class="popup-actions">
        <button class="pa-add" id="rpAddBtn" type="button">＋ この日に予約登録</button>
        <button class="pa-edit" id="rpEditBtn" type="button">✏️ この予約を編集する</button>
        <button class="pa-cancel" id="rpCancelBtn" type="button">🗑️ この予約を削除する</button>
      </div>
      <div class="modal-actions"><button class="modal-btn-cancel" id="rpCloseBtn" type="button">閉じる</button></div>
    </div>
  </div>

  <!-- イベント詳細ポップアップ -->
  <div class="modal-overlay" id="evPopup">
    <div class="modal-box">
      <div class="modal-title" id="epTitle">📌 行事</div>
      <div class="popup-row"><span class="k">日時：</span><span id="epDatetime"></span></div>
      <div class="popup-actions">
        <button class="pa-add" id="epAddBtn" type="button">＋ この日に予約登録</button>
        <button class="pa-edit" id="epManageBtn" type="button" style="display:none;">📌 行事を管理する</button>
      </div>
      <div class="modal-actions"><button class="modal-btn-cancel" id="epCloseBtn" type="button">閉じる</button></div>
    </div>
  </div>

  <!-- 予約 追加/編集モーダル -->
  <div class="modal-overlay" id="resModal">
    <div class="modal-box">
      <div class="modal-title" id="rmTitle">＋ 予約を追加</div>
      <div class="modal-field">
        <label>お客様</label>
        <input type="hidden" id="rmRealname" value="">
        <input type="hidden" id="rmCustomerId" value="">
        <button type="button" id="rmCustPickBtn" class="cust-pick-btn">👤 お客様を選択する</button>
        <div id="rmCustSelected" class="cust-selected" style="display:none;"></div>
        <div class="cust-hint">※ 一覧から選ぶか、新規登録してください（自由入力のままでは保存できません）</div>
        <button type="button" id="rmNewCustToggle" class="cust-new-toggle">＋ 新規顧客として登録する</button>
        <div id="rmNewCustBox" class="cust-new-box" style="display:none;">
          <div class="modal-field"><label>本名</label><input type="text" id="rmNewCustRealname" placeholder="スペース無しで入力"></div>
          <div class="modal-field"><label>フリガナ</label><input type="text" id="rmNewCustKana" placeholder="スペース無しで入力"></div>
          <label class="cust-keep-label"><input type="checkbox" id="rmNewCustKeep"> キープメンバーとして登録する</label>
          <div class="modal-err" id="rmNewCustErr" style="display:none;"></div>
          <button type="button" id="rmNewCustSaveBtn" class="modal-btn-ok" style="margin-top:8px;">この内容で顧客を登録する</button>
        </div>
      </div>
      <div class="modal-field"><label>担当スタッフ</label>
        <select id="rmStaff"><option value="未定">未定</option></select>
      </div>
      <div class="modal-field"><label>メインメニュー</label>
        <select id="rmMenu"></select>
      </div>
      <div class="modal-field"><label>オプション（任意・複数可）</label>
        <div id="rmMenuOptions" class="menu-options"></div>
      </div>
      <div class="modal-field"><label>日付</label><input type="date" id="rmDate"></div>
      <!-- ★2026-09-23追加：GAS版reservation_form_markup.html「🔍空き時間を確認する」
           （README §51-7で見送っていたもの）。押すと#rmTimeが空き時間だけの選択肢に
           切り替わる。一般スタッフは空いている時間しか選べず、オーナーは全時間帯を
           ⚠️警告付きで選べる（GAS版getAvailableSlots相当） -->
      <div class="modal-field">
        <label>時刻</label>
        <button type="button" id="rmCheckSlotsBtn" class="cust-pick-btn" style="margin-bottom:6px;">🔍 空き時間を確認する</button>
        <input type="time" id="rmTime">
        <select id="rmTimeSelect" style="display:none; width:100%; margin-top:6px; padding:9px 10px; border:1px solid var(--line); border-radius:8px; font-family:inherit; font-size:13.5px;"></select>
        <div id="rmSlotsHint" style="font-size:11.5px; color:var(--ink-soft); margin-top:4px;">日付を選んでから「空き時間を確認する」を押してください</div>
      </div>
      <div class="modal-field"><label>備考（任意）</label><input type="text" id="rmNote"></div>
      <!-- ★2026-09-23追加：GAS版reservation_form_markup.html 128行・assets.html 1006-1060行の
           「仮予約中（チェックを外すと確定になります）」。仮予約を編集画面から確定できる -->
      <div class="modal-field" id="rmProvGroup" style="display:none;">
        <label class="chk-row" style="font-weight:700; color:#D32F2F; font-size:13px;"><input type="checkbox" id="rmProvChk" checked> 仮予約中（チェックを外すと確定になります）</label>
      </div>
      <div class="modal-err" id="rmErr"></div>
      <div class="modal-actions">
        <button class="modal-btn-cancel" id="rmCancelBtn" type="button">閉じる</button>
        <button class="modal-btn-ok" id="rmSaveBtn" type="button">保存する</button>
      </div>
    </div>
  </div>

  <!-- お客様選択モーダル（GAS版reservation_form_assets.htmlのopenCustomerModal()相当。
       かな行インデックス付きの全件ブラウズ方式） -->
  <div class="modal-overlay" id="custPickModal">
    <div class="modal-box cust-pick-box">
      <div class="modal-title">👤 お客様を選択</div>
      <div class="kana-index" id="kanaIndex"></div>
      <div class="cust-pick-list" id="custPickList"></div>
      <div class="modal-actions"><button class="modal-btn-cancel" id="custPickCloseBtn" type="button">閉じる</button></div>
    </div>
  </div>

  <!-- 行事（イベント）管理モーダル：オーナー専用 -->
  <div class="modal-overlay" id="eventMgrModal">
    <div class="modal-box">
      <div class="modal-title">📌 行事を管理（<span id="emDateLabel"></span>）</div>
      <div id="emList"></div>
      <div style="border-top:1px solid var(--line); margin:12px 0; padding-top:10px;">
        <div class="modal-field"><label>行事名</label><input type="text" id="emTitle"></div>
        <div class="modal-field chk-row"><label style="margin:0;"><input type="checkbox" id="emAllday"> 終日</label></div>
        <div class="modal-field" id="emTimeRow" style="display:flex; gap:8px;">
          <div style="flex:1;"><label>開始</label><input type="time" id="emStart" value="09:00"></div>
          <div style="flex:1;"><label>終了</label><input type="time" id="emEnd" value="18:00"></div>
        </div>
        <div class="modal-field chk-row"><label style="margin:0;"><input type="checkbox" id="emRestrict"> 予約枠をブロックする（前後の時間帯も自動的に予約不可にする）</label></div>
        <div class="modal-err" id="emErr"></div>
        <div class="modal-actions">
          <button class="modal-btn-cancel" id="emResetBtn" type="button">クリア</button>
          <button class="modal-btn-ok" id="emSaveBtn" type="button">追加する</button>
        </div>
      </div>
      <div class="modal-actions"><button class="modal-btn-cancel" id="emCloseBtn" type="button">閉じる</button></div>
    </div>
  </div>

<script>
(function(){
  const loadingMsg = document.getElementById('loadingMsg');
  const shell = document.getElementById('shell');
  let ME = null;
  let view = 'week';
  let curDate = new Date(); curDate.setHours(0,0,0,0);
  let weekCache = {};
  let monthCache = {};
  let staffColors = {}, colorMap = {}, bgMap = {}, txMap = {};
  let staffList = [], menuItems = [], optionMenuItems = [];
  let currentPopupResv = null;
  let currentPopupEvent = null;
  let editingResvId = null;
  let emEditingId = null;
  // ★2026-09-23：GAS版（HOURS 9:00〜23:00、END=23:59）と同じく23時台まで表示する
  //   （以前は22時台までで、21:30以降の予約がグリッドからはみ出していた）
  const HOURS = []; for (let h = 9; h <= 23; h++) HOURS.push(h);
  const SH = 44; // px / hour
  const BASE_MIN = 9 * 60;
  const END_MIN = 23 * 60 + 59;
  const MENU_SEP = '　＋　';

  function pad2(n){ return String(n).padStart(2,'0'); }
  function fmtDate(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
  function addDays(d,n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
  function startOfWeek(d){ const x = new Date(d); x.setHours(0,0,0,0); const dow=(x.getDay()+6)%7; x.setDate(x.getDate()-dow); return x; }
  function toMin(t){ const [h,m] = String(t).split(':').map(Number); return h*60+(m||0); }
  function todayStr(){ return fmtDate(new Date()); }
  const DOW_LABELS = ['月','火','水','木','金','土','日'];

  async function staffFetch(url, opts) {
    const res = await fetch(url, opts);
    if (res.status === 401) throw new Error('UNAUTHORIZED');
    const body = await res.json().catch(() => ({}));
    if (!res.ok && !('success' in body)) throw new Error(body.message || body.error || ('サーバーエラー: ' + res.status));
    return body;
  }

  async function init() {
    try {
      const me = await staffFetch('/api/auth/me');
      ME = me.staff;
      const storeData = await staffFetch('/api/store');
      document.getElementById('headerInfo').textContent = `${storeData.store.name} ／ ${ME.isTerminal ? '🖥️ ' : ''}${ME.name}${!ME.isTerminal && ME.isOwner ? '（オーナー）' : ''}`;
      staffList = storeData.staffList || [];
      // ★2026-09-22追加：以前はメインメニュー（1択）しか参照していなかったが、GAS版
      //   （reservation_form_assets.html buildMenuValue()）・お客様向け予約フォーム
      //   （public/app.js）と同じく、メイン＋オプション（複数可）の組み合わせに対応させた
      const allMenuItems = storeData.menuItems || [];
      menuItems = allMenuItems.filter((m) => m.category === 'メインメニュー');
      optionMenuItems = allMenuItems.filter((m) => m.category !== 'メインメニュー');
      const staffSel = document.getElementById('rmStaff');
      staffList.forEach((s) => {
        const opt = document.createElement('option'); opt.value = s.realName; opt.textContent = s.realName;
        staffSel.appendChild(opt);
      });
      const menuSel = document.getElementById('rmMenu');
      menuItems.forEach((m) => {
        const opt = document.createElement('option'); opt.value = m.name; opt.textContent = m.name;
        menuSel.appendChild(opt);
      });
      const optBox = document.getElementById('rmMenuOptions');
      if (optionMenuItems.length === 0) {
        optBox.innerHTML = '<div class="empty">オプションメニューは登録されていません</div>';
      } else {
        optBox.innerHTML = '';
        optionMenuItems.forEach((m) => {
          const label = document.createElement('label');
          label.innerHTML = `<input type="checkbox" value="${escHtml(m.name)}"> ${escHtml(m.name)}`;
          optBox.appendChild(label);
        });
      }
      await render();
      loadingMsg.style.display = 'none';
      shell.classList.add('ready');
    } catch (e) {
      window.location.href = '/admin/login.html?next=' + encodeURIComponent(window.location.pathname);
    }
  }

  async function fetchWeek(sundayLikeMonday) {
    const key = fmtDate(sundayLikeMonday);
    if (weekCache[key]) return weekCache[key];
    const r = await staffFetch('/api/staff/calendar/week?start=' + key);
    if (!r.success) throw new Error(r.message || '取得に失敗しました');
    weekCache[key] = r.data;
    return r.data;
  }
  async function fetchMonth(year, month) {
    const key = year + '-' + month;
    if (monthCache[key]) return monthCache[key];
    const r = await staffFetch(`/api/staff/calendar/month?year=${year}&month=${month}`);
    if (!r.success) throw new Error(r.message || '取得に失敗しました');
    monthCache[key] = r.data;
    return r.data;
  }

  let legendStaff = [];
  function applyPalette(data) {
    staffColors = data.staffColors || {};
    legendStaff = data.legendStaff || Object.keys(staffColors);
    colorMap = data.colorMap || {};
    bgMap = data.bgMap || {};
    txMap = data.txMap || {};
  }

  function colorFor(staffName) {
    const key = staffColors[staffName];
    return {
      border: colorMap[key] || '#9E9E9E',
      bg: bgMap[key] || '#F5F5F5',
      tx: txMap[key] || '#424242'
    };
  }

  function updateNavLabel() {
    if (view === 'week') {
      const start = startOfWeek(curDate);
      const end = addDays(start, 6);
      document.getElementById('navLabel').textContent =
        `${start.getMonth()+1}/${start.getDate()} 〜 ${end.getMonth()+1}/${end.getDate()}`;
    } else {
      document.getElementById('navLabel').textContent = `${curDate.getFullYear()}年${curDate.getMonth()+1}月`;
    }
  }

  function renderLegend() {
    const el = document.getElementById('legend');
    el.innerHTML = '';
    legendStaff.forEach((name) => {
      const c = colorFor(name);
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.innerHTML = `<span class="dot" style="background:${c.border};"></span>${escHtml(name)}`;
      el.appendChild(chip);
    });
    // ★2026-09-23追加：GAS版の凡例（calendar_page.html 349行）と同じく「行事」も載せる
    const evChip = document.createElement('span');
    evChip.className = 'chip';
    evChip.innerHTML = '<span class="dot" style="background:#757575;"></span>行事';
    el.appendChild(evChip);
  }

  // ---------------- 週表示 ----------------
  async function renderWeek() {
    const start = startOfWeek(curDate);
    const data = await fetchWeek(start);
    applyPalette(data);
    renderLegend();

    const wrap = document.getElementById('weekView');
    const days = [];
    for (let i = 0; i < 7; i++) days.push(addDays(start, i));

    let html = '<div class="week-grid">';
    html += '<div class="wk-head corner"></div>';
    days.forEach((d) => {
      const jsDay = d.getDay();
      const cls = jsDay === 0 ? 'dow-sun' : (jsDay === 6 ? 'dow-sat' : '');
      const ds = fmtDate(d);
      const isToday = ds === todayStr();
      html += `<div class="wk-head ${cls}" data-date="${ds}">
        <div class="dow">${DOW_LABELS[(jsDay+6)%7]}</div>
        <div class="dnum ${isToday ? 'today' : ''}">${d.getDate()}</div>
        ${ME.isOwner ? `<div class="wk-head-evbtn" data-date="${ds}">📌+</div>` : ''}
      </div>`;
    });
    // hour column
    html += '<div class="wk-hourcol"><div class="wk-day-inner">';
    HOURS.forEach((h, i) => { html += `<div class="wk-hourline" style="top:${i*SH}px;"></div><div class="wk-hour" style="top:${i*SH}px; position:absolute;">${h}:00</div>`; });
    html += '</div></div>';

    days.forEach((d) => {
      const ds = fmtDate(d);
      html += `<div class="wk-day" data-date="${ds}"><div class="wk-day-inner" id="wkcol-${ds}">`;
      HOURS.forEach((h, i) => {
        html += `<div class="wk-hourline" style="top:${i*SH}px;"></div>`;
        html += `<div class="wk-slot-click" data-date="${ds}" data-time="${pad2(h)}:00" style="top:${i*SH}px;"></div>`;
      });
      html += '</div></div>';
    });
    html += '</div>';
    wrap.innerHTML = html;

    days.forEach((d) => {
      const ds = fmtDate(d);
      const dayResv = (data.reservations || []).filter((r) => r.date === ds);
      const dayEv = (data.events || []).filter((e) => e.date === ds);
      layoutDayLanes(ds, dayResv);
      renderWeekEvents(ds, dayEv);
    });

    wrap.querySelectorAll('.wk-slot-click').forEach((el) => {
      el.addEventListener('click', () => openAddReservation(el.dataset.date, el.dataset.time));
    });
    wrap.querySelectorAll('.wk-head-evbtn').forEach((el) => {
      el.addEventListener('click', (ev) => { ev.stopPropagation(); openEventManager(el.dataset.date); });
    });
  }

  function layoutDayLanes(ds, reservations) {
    const col = document.getElementById('wkcol-' + ds);
    if (!col) return;
    const staffLane = {};
    const lanes = [[], []]; // occupied intervals per lane
    const overlap = (a1,a2,b1,b2) => a1 < b2 && a2 > b1;

    reservations.forEach((r) => {
      const s = toMin(r.startTime), e = toMin(r.endTime);
      let lane = -1;
      const preferred = staffLane[r.staffName];
      if (preferred !== undefined && !lanes[preferred].some((iv) => overlap(iv[0], iv[1], s, e))) {
        lane = preferred;
      } else if (!lanes[0].some((iv) => overlap(iv[0], iv[1], s, e))) {
        lane = 0;
      } else if (!lanes[1].some((iv) => overlap(iv[0], iv[1], s, e))) {
        lane = 1;
      } else {
        lane = 1; // 3件以上重なる場合は2レーン目に重ねて表示（簡略化）
      }
      lanes[lane].push([s, e]);
      staffLane[r.staffName] = lane;

      const c = colorFor(r.staffName);
      const top = (s - BASE_MIN) / 60 * SH;
      // ★GAS版と同じく23:59で切る（グリッドの下にはみ出さない）
      const height = Math.max(18, (Math.min(e, END_MIN) - s) / 60 * SH - 2);
      const left = lane === 0 ? '2%' : '51%';
      const width = '47%';
      const blk = document.createElement('div');
      blk.className = 'ev-blk';
      blk.style.top = top + 'px';
      blk.style.height = height + 'px';
      blk.style.left = left; blk.style.width = width;
      blk.style.background = c.bg; blk.style.borderLeftColor = c.border; blk.style.color = c.tx;
      // ★2026-09-23追加：GAS版（calendar_page.html 729-740行）と同じく、メニューの
      //   オプション部分（「メイン　＋　オプション」の2つ目以降）を「＋◯◯」で表示する
      const optNames = String(r.menu || '').split(MENU_SEP).slice(1).map((x) => x.trim()).filter(Boolean);
      blk.innerHTML = (r.isProvisional ? '<span class="prov">仮＋</span>' : '') + `<span class="nm">${escHtml(r.realname)}</span><br>${r.startTime} ${escHtml(r.staffName)}` +
        (optNames.length ? `<br><span class="opt">＋${escHtml(optNames.join('＋'))}</span>` : '');
      blk.addEventListener('click', (ev) => { ev.stopPropagation(); openReservationPopup(r); });
      col.appendChild(blk);
    });
  }

  // ★2026-09-23修正：GAS版calendar_page.html 678-702行の描き分けを移植。
  //   ・終日の行事 … 列の上端に帯（.ev-allday-bar）で表示。予約不可（休業）の終日行事が
  //     ある日は、列全体を灰色にする（予約ブロックの下に敷く背景なので予約は隠れない）
  //   ・時間指定の行事 … その時間帯にブロック表示（予約より下の重なり順）。予約ブロック
  //     対象なら、前後の予約不可時間帯を斜線で表示（GAS版の.ev-buffer）
  //   以前は終日の行事も00:00〜23:59の縦長ブロックとして描いていたため、列全体を覆って
  //   その日の予約が見えず・押せなくなる不具合があった（社長ご指摘の棚卸しで発見）。
  function renderWeekEvents(ds, dayEvents) {
    const col = document.getElementById('wkcol-' + ds);
    if (!col) return;
    const allDay = dayEvents.filter((e) => e.allDay);
    const timed = dayEvents.filter((e) => !e.allDay);
    if (allDay.some((e) => e.blockReservation)) col.classList.add('fullblock');
    if (allDay.length) {
      const wrap = document.createElement('div');
      wrap.className = 'ev-allday-wrap';
      allDay.forEach((e) => {
        const bar = document.createElement('div');
        bar.className = 'ev-allday-bar' + (e.blockReservation ? ' is-blocked' : '');
        bar.textContent = (e.blockReservation ? '🚫 ' : '📌 ') + e.label;
        bar.title = e.blockReservation ? '終日休み（予約不可）' : '終日の行事（予約可）';
        bar.addEventListener('click', (ev) => { ev.stopPropagation(); openEventPopup(e); });
        wrap.appendChild(bar);
      });
      col.appendChild(wrap);
    }
    timed.forEach((e) => {
      const s = toMin(e.startTime), en = toMin(e.endTime || e.startTime);
      if (e.blockReservation && e.blockStart && e.blockEnd) {
        const bs = Math.max(BASE_MIN, toMin(e.blockStart)), be = Math.min(END_MIN, toMin(e.blockEnd));
        if (be > bs) {
          const buf = document.createElement('div');
          buf.className = 'ev-buffer';
          buf.style.top = ((bs - BASE_MIN) / 60 * SH) + 'px';
          buf.style.height = ((be - bs) / 60 * SH) + 'px';
          col.appendChild(buf);
        }
      }
      const blk = document.createElement('div');
      blk.className = 'ev-event';
      blk.style.top = Math.max(0, (s - BASE_MIN) / 60 * SH) + 'px';
      blk.style.height = Math.max(36, (Math.min(en, END_MIN) - Math.max(s, BASE_MIN)) / 60 * SH - 1) + 'px';
      blk.textContent = (e.blockReservation ? '🚫 ' : '📌 ') + e.label;
      blk.addEventListener('click', (ev) => { ev.stopPropagation(); openEventPopup(e); });
      col.appendChild(blk);
    });
  }

  // ---------------- 月表示 ----------------
  async function renderMonth() {
    const year = curDate.getFullYear(), month = curDate.getMonth() + 1;
    const data = await fetchMonth(year, month);
    applyPalette(data);
    renderLegend();

    const el = document.getElementById('monthView');
    let html = '';
    DOW_LABELS.forEach((lbl, i) => {
      const cls = i === 5 ? 'dow-sat' : (i === 6 ? 'dow-sun' : '');
      html += `<div class="m-head ${cls}">${lbl}</div>`;
    });

    const firstOfMonth = new Date(year, month - 1, 1);
    const startPad = (firstOfMonth.getDay() + 6) % 7; // 月曜始まり
    const daysInMonth = new Date(year, month, 0).getDate();
    const gridStart = addDays(firstOfMonth, -startPad);
    const totalCells = Math.ceil((startPad + daysInMonth) / 7) * 7;

    const resvByDate = {}, evByDate = {};
    (data.reservations || []).forEach((r) => { (resvByDate[r.date] = resvByDate[r.date] || []).push(r); });
    (data.events || []).forEach((e) => { (evByDate[e.date] = evByDate[e.date] || []).push(e); });

    for (let i = 0; i < totalCells; i++) {
      const d = addDays(gridStart, i);
      const ds = fmtDate(d);
      const inMonth = d.getMonth() === month - 1;
      const jsDay = d.getDay();
      const cls = ['mday'];
      if (!inMonth) cls.push('other');
      if (jsDay === 0) cls.push('dow-sun'); if (jsDay === 6) cls.push('dow-sat');
      const isToday = ds === todayStr();
      let inner = `<div class="dnum ${isToday ? 'today' : ''}">${d.getDate()}</div>`;
      if (inMonth && ME.isOwner) inner += `<div class="m-add-icon" data-date="${ds}">📌</div>`;
      if (inMonth) {
        // ★2026-09-23変更：GAS版（calendar_page.html 778-784行）と同じく、行事を先に、
        //   その日の予約は件数制限なく全件表示する（以前は先頭3件＋「他N件」で、
        //   「他N件」を押しても開けなかった）
        (evByDate[ds] || []).forEach((e, ei) => {
          inner += `<div class="mevent-bar${e.blockReservation ? ' is-blocked' : ''}" data-date="${ds}" data-evidx="${ei}">${e.blockReservation ? '🚫' : '📌'} ${escHtml(e.label)}</div>`;
        });
        (resvByDate[ds] || []).forEach((r, idx) => {
          const c = colorFor(r.staffName);
          inner += `<div class="mev" data-idx="${idx}" data-date="${ds}" style="background:${c.bg}; border-left-color:${c.border}; color:${c.tx};">${r.isProvisional ? '<b style="color:#D32F2F;">仮</b> ' : ''}${r.startTime} ${escHtml(r.realname)}</div>`;
        });
      }
      html += `<div class="${cls.join(' ')}" data-date="${ds}" data-inmonth="${inMonth}">${inner}</div>`;
    }
    el.innerHTML = html;

    el.querySelectorAll('.mday').forEach((cell) => {
      if (cell.dataset.inmonth !== 'true') return;
      cell.addEventListener('click', (ev) => {
        if (ev.target.closest('.mev') || ev.target.closest('.mevent-bar') || ev.target.closest('.m-add-icon')) return;
        openAddReservation(cell.dataset.date, '');
      });
    });
    el.querySelectorAll('.mev').forEach((chip) => {
      chip.addEventListener('click', (ev) => {
        ev.stopPropagation();
        const ds = chip.dataset.date;
        const r = (resvByDate[ds] || [])[Number(chip.dataset.idx)];
        if (r) openReservationPopup(r);
      });
    });
    el.querySelectorAll('.mevent-bar').forEach((chip) => {
      chip.addEventListener('click', (ev) => {
        ev.stopPropagation();
        const ds = chip.dataset.date;
        const e = (evByDate[ds] || [])[Number(chip.dataset.evidx)];
        if (e) openEventPopup(e);
      });
    });
    el.querySelectorAll('.m-add-icon').forEach((icon) => {
      icon.addEventListener('click', (ev) => { ev.stopPropagation(); openEventManager(icon.dataset.date); });
    });
  }

  async function render() {
    updateNavLabel();
    document.getElementById('weekView').style.display = view === 'week' ? '' : 'none';
    document.getElementById('monthView').style.display = view === 'month' ? '' : 'none';
    try {
      if (view === 'week') await renderWeek(); else await renderMonth();
    } catch (e) {
      if (e.message === 'UNAUTHORIZED') { window.location.href = '/admin/login.html?next=' + encodeURIComponent(window.location.pathname); return; }
      alert(e.message);
    }
  }

  function escHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------------- ナビゲーション ----------------
  document.getElementById('viewWeekBtn').addEventListener('click', () => { view = 'week'; document.getElementById('viewWeekBtn').classList.add('active'); document.getElementById('viewMonthBtn').classList.remove('active'); render(); });
  document.getElementById('viewMonthBtn').addEventListener('click', () => { view = 'month'; document.getElementById('viewMonthBtn').classList.add('active'); document.getElementById('viewWeekBtn').classList.remove('active'); render(); });
  document.getElementById('navPrevBtn').addEventListener('click', () => { curDate = view === 'week' ? addDays(curDate, -7) : new Date(curDate.getFullYear(), curDate.getMonth()-1, 1); render(); });
  document.getElementById('navNextBtn').addEventListener('click', () => { curDate = view === 'week' ? addDays(curDate, 7) : new Date(curDate.getFullYear(), curDate.getMonth()+1, 1); render(); });
  document.getElementById('navTodayBtn').addEventListener('click', () => { curDate = new Date(); curDate.setHours(0,0,0,0); render(); });
  document.getElementById('reloadBtn').addEventListener('click', () => { weekCache = {}; monthCache = {}; render(); checkSessionStillValid(); });

  // ★2026-09-23追加：GAS版calendar_page.html 288-319行と同じく、30秒ごとにログイン状態を
  //   確認し、別の画面でログアウトされていたら「ログアウトされました」と表示して操作を止める
  //   （以前は次に何か操作してエラーになるまで気付けなかった）
  async function checkSessionStillValid() {
    try {
      const res = await fetch('/api/auth/me');
      if (res.status === 401) showLoggedOutOverlay();
    } catch (_) { /* 通信エラーは一時的な可能性があるため無視 */ }
  }
  function showLoggedOutOverlay() {
    if (document.getElementById('loggedOutOverlay')) return;
    const ov = document.createElement('div');
    ov.id = 'loggedOutOverlay';
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(255,255,255,0.7);z-index:9999;display:flex;align-items:center;justify-content:center;';
    ov.innerHTML = '<div style="background:#fff;border:1px solid #ddd;border-radius:12px;padding:24px 28px;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,0.15);max-width:320px;">' +
      '<p style="margin-bottom:14px;font-size:14px;line-height:1.6;">🔒 ログアウトされました<br><span style="font-size:12px;color:#777;">（別の画面でログアウトが行われたか、ログインの有効期限が切れました）</span></p>' +
      '<button type="button" style="background:#3D6B5C;color:#fff;border:none;border-radius:8px;padding:10px 20px;cursor:pointer;font-family:inherit;">もう一度ログインする</button></div>';
    ov.querySelector('button').addEventListener('click', () => {
      window.location.href = '/admin/login.html?next=' + encodeURIComponent(window.location.pathname);
    });
    document.body.appendChild(ov);
  }
  setInterval(checkSessionStillValid, 30000);
  document.getElementById('calLogoutLink').addEventListener('click', async (e) => {
    e.preventDefault();
    if (!confirm('ログアウトしますか？次回はPINでのログインが必要になります。')) return;
    try { await fetch('/api/auth/logout', { method: 'POST' }); } catch (_) {}

  // ---------------- 予約 追加/編集モーダル ----------------
  // ---------------- 顧客選択・新規登録（GAS版reservation_form_assets.htmlの
  //   openCustomerModal()/registerNewCustomer()相当）。社長の指摘により、GAS版と
  //   同じ「かな行インデックス（あ/か/さ…の見出しボタン）付きの全件ブラウズ方式」の
  //   選択モーダルとした。一致する顧客がいなければ、同じ画面内の「新規顧客」欄から
  //   その場で顧客マスタに登録できる（GAS版のnewCustomerモードに相当） ----------------
  const KANA_ROWS = [
    { key: 'あ', chars: 'アイウエオ' }, { key: 'か', chars: 'カキクケコガギグゲゴ' },
    { key: 'さ', chars: 'サシスセソザジズゼゾ' }, { key: 'た', chars: 'タチツテトダヂヅデド' },
    { key: 'な', chars: 'ナニヌネノ' }, { key: 'は', chars: 'ハヒフヘホバビブベボパピプペポ' },
    { key: 'ま', chars: 'マミムメモ' }, { key: 'や', chars: 'ヤユヨ' },
    { key: 'ら', chars: 'ラリルレロ' }, { key: 'わ', chars: 'ワヲン' }
  ];
  let allCustomersCache = null;
  let kanaFilter = 'すべて';
  function kanaRowOf(kana) {
    const c = String(kana || '').charAt(0);
    const row = KANA_ROWS.find((r) => r.chars.includes(c));
    return row ? row.key : '他';
  }
  function resetCustomerPicker() {
    document.getElementById('rmCustomerId').value = '';
    document.getElementById('rmCustSelected').style.display = 'none';
    document.getElementById('rmNewCustBox').style.display = 'none';
    document.getElementById('rmNewCustRealname').value = '';
    document.getElementById('rmNewCustKana').value = '';
    document.getElementById('rmNewCustKeep').checked = false;
    document.getElementById('rmNewCustErr').style.display = 'none';
  }
  function selectCustomer(c) {
    document.getElementById('rmRealname').value = c.realname;
    document.getElementById('rmCustomerId').value = c.customerId;
    const sel = document.getElementById('rmCustSelected');
    sel.textContent = `✓ ${c.realname}様を選択済み（フリガナ：${c.kana || '未登録'}）`;
    sel.style.display = 'block';
    document.getElementById('rmNewCustBox').style.display = 'none';
    document.getElementById('custPickModal').classList.remove('show');
  }
  function renderKanaIndex() {
    const box = document.getElementById('kanaIndex');
    box.innerHTML = '';
    ['すべて', ...KANA_ROWS.map((r) => r.key), '他'].forEach((key) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = key;
      btn.className = key === kanaFilter ? 'active' : '';
      btn.addEventListener('click', () => { kanaFilter = key; renderCustPickList(); renderKanaIndex(); });
      box.appendChild(btn);
    });
  }
  function renderCustPickList() {
    const box = document.getElementById('custPickList');
    const rows = (allCustomersCache || []).filter((c) => kanaFilter === 'すべて' || kanaRowOf(c.kana) === kanaFilter);
    if (rows.length === 0) {
      box.innerHTML = '<div class="cust-empty">この行に該当する顧客はいません</div>';
      return;
    }
    box.innerHTML = '';
    rows.forEach((c) => {
      const row = document.createElement('div');
      row.className = 'cust-row';
      row.innerHTML = `${escHtml(c.realname)}<span class="k">${escHtml(c.kana || '')}${c.phone ? ' ／ ' + escHtml(c.phone) : ''}</span>`;
      row.addEventListener('click', () => selectCustomer(c));
      box.appendChild(row);
    });
  }
  document.getElementById('rmCustPickBtn').addEventListener('click', async () => {
    document.getElementById('rmNewCustBox').style.display = 'none';
    kanaFilter = 'すべて';
    document.getElementById('custPickList').innerHTML = '<div class="cust-empty">読み込み中…</div>';
    document.getElementById('custPickModal').classList.add('show');
    renderKanaIndex();
    try {
      const data = await staffFetch('/api/staff/customers/list');
      allCustomersCache = data.customers || [];
      renderCustPickList();
    } catch (e) {
      document.getElementById('custPickList').innerHTML = '<div class="cust-empty">読み込みに失敗しました</div>';
    }
  });
  document.getElementById('custPickCloseBtn').addEventListener('click', () => {
    document.getElementById('custPickModal').classList.remove('show');
  });
  document.getElementById('custPickModal').addEventListener('click', (e) => { if (e.target.id === 'custPickModal') e.currentTarget.classList.remove('show'); });
  document.getElementById('rmNewCustToggle').addEventListener('click', () => {
    const box = document.getElementById('rmNewCustBox');
    box.style.display = box.style.display === 'none' ? 'block' : 'none';
    if (box.style.display === 'block') document.getElementById('rmNewCustRealname').focus();
  });
  document.getElementById('rmNewCustSaveBtn').addEventListener('click', async () => {
    const errBox = document.getElementById('rmNewCustErr');
    errBox.style.display = 'none';
    const realname = document.getElementById('rmNewCustRealname').value.trim();
    const kana = document.getElementById('rmNewCustKana').value.trim();
    const isKeepMember = document.getElementById('rmNewCustKeep').checked;
    if (!realname) {
      errBox.textContent = 'お客様氏名を入力してください';
      errBox.style.display = 'block';
      return;
    }
    // ★2026-09-22追加：社長承認事項（README47-5参照）。「＋新規顧客として登録する」は
    //   GAS版には無い簡略化だが、既存に同じ人がいないことが前提のため、登録実行の直前に
    //   もう一度その場で本名の完全一致検索を行い、既存顧客が見つかった場合は登録させず
    //   一覧から選ぶよう促す（サーバー側でも本名の重複はcreateCustomerManually()が
    //   409で拒否するため、これは早期に気付かせるための二重チェック）
    try {
      const dupCheck = await staffFetch('/api/staff/customers/search?q=' + encodeURIComponent(realname));
      const exact = (dupCheck.customers || []).find((c) => c.realname === realname);
      if (exact) {
        errBox.textContent = `既に同名の顧客が登録されています（フリガナ：${exact.kana || '未登録'}）。「👤 お客様を選択する」から選んでください`;
        errBox.style.display = 'block';
        return;
      }
    } catch (e) { /* 重複チェックの通信に失敗しても、サーバー側の最終チェック（409）に任せて登録処理は続行する */ }
    try {
      const r = await staffFetch('/api/staff/customers', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ realname, kana, isKeepMember })
      });
      if (!r.success) { errBox.textContent = r.message || '登録に失敗しました'; errBox.style.display = 'block'; return; }
      selectCustomer({ realname, kana, customerId: r.customerId });
      document.getElementById('rmCustSelected').textContent = `✓ 新規顧客として登録し、${realname}様をこの予約に紐付けました`;
      allCustomersCache = null; // 次に選択モーダルを開いたときに最新の一覧を取り直す
    } catch (e) { errBox.textContent = e.message; errBox.style.display = 'block'; }
  });

  // ---------------- メニュー（メイン＋オプション）の組み立て・分解 ----------------
  function composeMenu() {
    const main = document.getElementById('rmMenu').value;
    const opts = Array.from(document.querySelectorAll('#rmMenuOptions input:checked')).map((el) => el.value);
    return [main, ...opts].join('　＋　');
  }
  function applyMenuToForm(menuStr) {
    const parts = String(menuStr || '').split('　＋　').map((s) => s.trim()).filter(Boolean);
    document.getElementById('rmMenu').value = parts[0] || '';
    const optSet = new Set(parts.slice(1));
    document.querySelectorAll('#rmMenuOptions input').forEach((el) => { el.checked = optSet.has(el.value); });
  }

  // ★2026-09-23追加：「🔍空き時間を確認する」（GAS版checkAvailableSlots相当、
  //   README §51-7で見送っていたもの）。一般スタッフには実際に空いている時間だけを、
  //   オーナーには全時間帯を⚠️警告ラベル付きで表示する。選ぶと#rmTimeへ反映される
  //   （保存処理自体は既存の#rmTimeをそのまま使うため変更不要）
  async function checkAvailableSlots() {
    const date = document.getElementById('rmDate').value;
    const hint = document.getElementById('rmSlotsHint');
    if (!date) { hint.textContent = '予約日を選択してください'; return; }
    const staffName = document.getElementById('rmStaff').value;
    const btn = document.getElementById('rmCheckSlotsBtn');
    const sel = document.getElementById('rmTimeSelect');
    btn.disabled = true; btn.textContent = '⏳ 確認中...';
    try {
      const qs = new URLSearchParams({ staffName, date });
      if (editingResvId) qs.set('excludeId', String(editingResvId));
      const r = await staffFetch('/api/staff/available-slots?' + qs.toString());
      if (!r.success) throw new Error(r.message || '取得に失敗しました');
      const slots = r.slots || [];
      sel.innerHTML = '';
      if (slots.length === 1 && slots[0].disabled && !slots[0].time) {
        sel.style.display = 'none';
        hint.textContent = (slots[0].reason || 'この日は空き時間がありません') + '（時間外の登録はオーナーにご相談ください）';
        return;
      }
      const placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.textContent = '選択してください';
      sel.appendChild(placeholder);
      let availableCount = 0;
      const currentTime = document.getElementById('rmTime').value;
      slots.forEach((slot) => {
        const opt = document.createElement('option');
        if (slot.warn) {
          opt.value = slot.time;
          opt.textContent = `${slot.time} ⚠️（${slot.warnLabel}）`;
        } else if (slot.disabled) {
          opt.value = '';
          opt.textContent = `${slot.time} ×（${slot.reason}）`;
          opt.disabled = true;
        } else {
          opt.value = slot.time;
          opt.textContent = `${slot.time} ○`;
          availableCount++;
        }
        sel.appendChild(opt);
      });
      if (currentTime && Array.from(sel.options).some((o) => o.value === currentTime)) {
        sel.value = currentTime;
      }
      sel.style.display = 'block';
      if (r.isOwner) {
        hint.textContent = availableCount > 0
          ? `○=${availableCount}枠空いています（⚠️は重複あり、確認のうえ選べます）`
          : '⚠️ すべての時間帯に重複があります。確認のうえ選んでください';
      } else {
        hint.textContent = availableCount > 0 ? `○=${availableCount}枠空いています` : 'この日は空き時間がありません';
      }
    } catch (e) {
      hint.textContent = '取得に失敗しました: ' + e.message;
    } finally {
      btn.disabled = false; btn.textContent = '🔍 空き時間を確認する';
    }
  }
  document.getElementById('rmCheckSlotsBtn').addEventListener('click', checkAvailableSlots);
  document.getElementById('rmTimeSelect').addEventListener('change', (ev) => {
    if (ev.target.value) document.getElementById('rmTime').value = ev.target.value;
  });

  // ★2026-09-23追加：「仮予約中」のチェックを外す＝確定（GAS版onProvisionalCheckboxChange相当）。
  //   GAS版と同じく、画面上で担当スタッフを選び直していれば、その担当で確定する。
  //   確定後は「保存する」ボタンを無効にする（確定直後に保存を押すと、中身が同じでも
  //   「予約が変更されました」のLINEが二重に送られてしまうため。GAS版と同じ安全策）
  document.getElementById('rmProvChk').addEventListener('change', async (ev) => {
    const chk = ev.target;
    if (chk.checked || !editingResvId) return; // 仮予約に戻す操作は一方通行のため何もしない
    if (!confirm('この予約を確定していいですか？')) { chk.checked = true; return; }
    chk.disabled = true;
    try {
      const r = await staffFetch(`/api/staff/reservations/${editingResvId}/confirm`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ staffName: document.getElementById('rmStaff').value })
      });
      if (!r.success) { alert(r.message || '確定に失敗しました'); chk.checked = true; chk.disabled = false; return; }
      document.getElementById('rmProvGroup').style.display = 'none';
      const saveBtn = document.getElementById('rmSaveBtn');
      saveBtn.disabled = true; saveBtn.style.opacity = '0.4';
      weekCache = {}; monthCache = {};
      render();
      if (r.message) alert(r.message);
    } catch (e) { alert(e.message); chk.checked = true; chk.disabled = false; }
  });
  document.getElementById('rmCancelBtn').addEventListener('click', () => document.getElementById('resModal').classList.remove('show'));
  document.getElementById('rmSaveBtn').addEventListener('click', async () => {
    const errBox = document.getElementById('rmErr');
    errBox.style.display = 'none';
    const realname = document.getElementById('rmRealname').value.trim();
    const customerId = document.getElementById('rmCustomerId').value;
    const staffName = document.getElementById('rmStaff').value;
    const menu = composeMenu();
    const date = document.getElementById('rmDate').value;
    const time = document.getElementById('rmTime').value;
    const note = document.getElementById('rmNote').value.trim();
    if (!realname || !staffName || !document.getElementById('rmMenu').value || !date || !time) {
      errBox.textContent = 'お客様氏名・担当・メインメニュー・日付・時刻は必須です';
      errBox.style.display = 'block';
      return;
    }
    // ★2026-09-22追加：社長方針（README47-5参照）。スタッフ入力の負担軽減とGAS版との
    //   整合のため、新規予約の登録時はフリーテキストのままでの保存を禁止し、検索して
    //   既存顧客を選ぶか「＋新規顧客として登録する」で登録するかのどちらかを必須とする
    //   （customerIdが空のまま保存はできない）。既存予約の編集時は、予約の顧客が
    //   誰であるかを変更する機能ではないため、この必須チェックは対象外とする
    if (!editingResvId && !customerId) {
      errBox.textContent = '既存の顧客を検索して選択するか、「＋新規顧客として登録する」から登録してください（自由入力のままでは保存できません）';
      errBox.style.display = 'block';
      return;
    }
    try {
      let r;
      if (editingResvId) {
        r = await staffFetch('/api/staff/reservations/' + editingResvId, {
          method: 'PUT', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ staffName, menu, date, time, note })
        });
      } else {
        r = await staffFetch('/api/staff/reservations', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ realname, customerId, staffName, menu, date, time, note })
        });
        if (r.isLimitWarning) {
          if (confirm(r.message + '\n続行しますか？')) {
            r = await staffFetch('/api/staff/reservations', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ realname, customerId, staffName, menu, date, time, note, ownerOverride: true })
            });
          } else { return; }
        }
      }
      if (!r.success) { errBox.textContent = r.message || '保存に失敗しました'; errBox.style.display = 'block'; return; }
      document.getElementById('resModal').classList.remove('show');
      weekCache = {}; monthCache = {};
      render();
      // ★2026-09-22追加：GAS版と同じく、LINE通知の実行結果（📱送信済み／⚠️失敗／
      //   ℹ️未登録）を含む結果メッセージを操作者に表示する
      if (r.message) alert(r.message);
    } catch (e) { errBox.textContent = e.message; errBox.style.display = 'block'; }
  });

    document.getElementById('emTimeRow').style.display = 'flex';
    document.getElementById('emErr').style.display = 'none';
    document.getElementById('emSaveBtn').textContent = '追加する';
  }
  document.getElementById('emAllday').addEventListener('change', (e) => {
    document.getElementById('emTimeRow').style.display = e.target.checked ? 'none' : 'flex';
  });
  async function loadEventManagerList() {
    const listEl = document.getElementById('emList');
    listEl.innerHTML = '読み込み中...';
    try {
      const r = await staffFetch('/api/staff/calendar/events?date=' + emCurrentDate);
      const rows = r.events || [];
      if (rows.length === 0) { listEl.innerHTML = '<div style="font-size:12px; color:var(--ink-soft);">登録されている行事はありません</div>'; return; }
      listEl.innerHTML = '';
      rows.forEach((ev) => {
        const row = document.createElement('div');
        row.className = 'ev-list-item';
        row.innerHTML = `
          <div>${escHtml(ev.label)}（${(!ev.startTime || (ev.startTime === '00:00' && ev.endTime === '23:59')) ? (ev.restrictBooking ? '終日休み（予約不可）' : '終日の行事（予約可）') : ev.startTime + '〜' + ev.endTime}）${ev.restrictBooking ? ' 🚫予約ブロック' : ''}</div>
          <div class="ev-btns"><button type="button" data-act="edit">編集</button><button type="button" data-act="del">削除</button></div>
        `;
        row.querySelector('[data-act=edit]').addEventListener('click', () => {
          emEditingId = ev.id;
          document.getElementById('emTitle').value = ev.label;
          const isAllday = ev.startTime === '00:00' && ev.endTime === '23:59';
          document.getElementById('emAllday').checked = isAllday;
          document.getElementById('emTimeRow').style.display = isAllday ? 'none' : 'flex';
          document.getElementById('emStart').value = ev.startTime || '09:00';
          document.getElementById('emEnd').value = ev.endTime || '18:00';
          document.getElementById('emRestrict').checked = ev.restrictBooking;
          document.getElementById('emSaveBtn').textContent = '変更を保存する';
        });
        row.querySelector('[data-act=del]').addEventListener('click', async () => {
          if (!confirm(`「${ev.label}」を削除しますか？`)) return;
          try {
            await staffFetch('/api/admin/events/' + ev.id, { method: 'DELETE' });
            weekCache = {}; monthCache = {};
            await loadEventManagerList();
            render();
          } catch (e) { alert(e.message); }
        });
        listEl.appendChild(row);
      });
    } catch (e) { listEl.innerHTML = '<div class="modal-err">' + escHtml(e.message) + '</div>'; }
  }
  document.getElementById('emResetBtn').addEventListener('click', resetEventForm);
  document.getElementById('emCloseBtn').addEventListener('click', () => document.getElementById('eventMgrModal').classList.remove('show'));
  document.getElementById('eventMgrModal').addEventListener('click', (e) => { if (e.target.id === 'eventMgrModal') e.currentTarget.classList.remove('show'); });
  document.getElementById('emSaveBtn').addEventListener('click', async () => {
    const errBox = document.getElementById('emErr');
    errBox.style.display = 'none';
    const title = document.getElementById('emTitle').value.trim();
    const allday = document.getElementById('emAllday').checked;
    const startTime = allday ? '00:00' : document.getElementById('emStart').value;
    const endTime = allday ? '23:59' : document.getElementById('emEnd').value;
    const restrictBooking = document.getElementById('emRestrict').checked;
    if (!title || !startTime || !endTime) { errBox.textContent = '行事名・時刻は必須です'; errBox.style.display = 'block'; return; }
    try {
      const body = JSON.stringify({ title, date: emCurrentDate, startTime, endTime, restrictBooking });
      let r;
      if (emEditingId) {
        r = await staffFetch('/api/admin/events/' + emEditingId, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body });
      } else {
        r = await staffFetch('/api/admin/events', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body });
      }
      if (!r.success) { errBox.textContent = r.message || '保存に失敗しました'; errBox.style.display = 'block'; return; }
      resetEventForm();
      weekCache = {}; monthCache = {};
      await loadEventManagerList();
      render();
    } catch (e) { errBox.textContent = e.message; errBox.style.display = 'block'; }
  });

  init();
})();
</script>
