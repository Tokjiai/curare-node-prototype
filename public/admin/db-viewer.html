<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DB一覧ビューア（閲覧専用）</title>
<style>
  /* ============================================================
     ★2026-09-23追加：社長より「全体の予約や顧客データを見渡せるスプレット
     シートのような画面」「admin権限のみで入れるDBを直接視覚的にみれるページ」
     の要望を受けて新設。既存のcustomers-view.html／reservations-view.htmlが
     目的別に整形した一覧なのに対し、こちらは店舗の主要テーブルを横断的に
     スプレットシートのグリッドに近い形で並べ替え・検索しながら閲覧できる
     ページ。オーナーのみアクセス可、閲覧専用（編集はしない）。
     詳細はREADME_PROTOTYPE.md 章51参照。
     ============================================================ */
  :root{
    --bg:#F5F4EF; --panel:#ffffff; --ink:#2B2B27; --ink-soft:#75746C; --ink-faint:#A9A79C;
    --line:#E4E2D9; --accent:#3D6B5C; --accent-soft:#E7EFE9; --admin:#8A5A3C; --admin-soft:#F5EBE3;
    --warn:#B3542E; --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0; font-family:'Hiragino Sans','Yu Gothic',sans-serif;}
  body{background:var(--bg); color:var(--ink);}
  .wrap{display:none; padding:18px 20px; max-width:1400px; margin:0 auto;}
  .wrap.ready{display:block;}
  #loadingMsg{text-align:center; color:var(--ink-soft); font-size:13px; padding:60px 0;}

  .page-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px; gap:10px; flex-wrap:wrap;}
  .page-head h1{font-size:18px; font-weight:700; margin-bottom:3px;}
  .page-head p{font-size:12px; color:var(--ink-soft);}
  .view-badge{font-size:11px; font-weight:700; background:var(--admin-soft); color:var(--admin); padding:5px 10px; border-radius:8px; white-space:nowrap;}
  .close-btn{background:none; border:1px solid var(--line); border-radius:8px; padding:6px 14px; font-size:13px; color:var(--ink-soft); cursor:pointer; font-family:inherit;}

  .tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
  .tab-btn{padding:7px 13px; border-radius:20px; border:1px solid var(--line); background:#fff; font-size:12.5px; cursor:pointer; font-family:inherit; color:var(--ink-soft);}
  .tab-btn.active{background:var(--accent); color:#fff; border-color:var(--accent); font-weight:700;}

  .toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:10px;}
  .toolbar input[type=text]{flex:1; min-width:200px; padding:9px 12px; border-radius:8px; border:1px solid var(--line); font-size:13px; font-family:inherit;}
  .toolbar .count{font-size:12px; color:var(--ink-soft); white-space:nowrap;}
  .toolbar button{padding:8px 13px; border-radius:8px; border:1px solid var(--line); background:#fff; font-size:12.5px; cursor:pointer; font-family:inherit;}

  .grid-panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:auto; max-height:70vh;}
  table.gridtbl{border-collapse:collapse; width:100%; font-size:12.5px; white-space:nowrap;}
  table.gridtbl thead th{position:sticky; top:0; background:var(--admin-soft); color:var(--admin); text-align:left; padding:8px 10px; border-bottom:2px solid var(--line); cursor:pointer; user-select:none; z-index:2;}
  table.gridtbl thead th:hover{background:#EDE0D3;}
  table.gridtbl thead th .arrow{font-size:10px; margin-left:3px; opacity:0.6;}
  table.gridtbl tbody td{padding:6px 10px; border-bottom:1px solid #F1EFE8; max-width:280px; overflow:hidden; text-overflow:ellipsis;}
  table.gridtbl tbody tr:nth-child(even){background:#FAFAF6;}
  table.gridtbl tbody tr:hover{background:var(--accent-soft);}
  .empty-row td{text-align:center; color:var(--ink-faint); padding:30px 0;}

  .pager{display:flex; justify-content:center; align-items:center; gap:12px; margin-top:12px; font-size:12.5px; color:var(--ink-soft);}
  .pager button{padding:6px 12px; border-radius:8px; border:1px solid var(--line); background:#fff; font-size:12.5px; cursor:pointer; font-family:inherit;}
  .pager button:disabled{opacity:0.4; cursor:not-allowed;}

  .err-box{background:#FDEDEA; color:var(--warn); border:1px solid #F3C9BC; border-radius:10px; padding:10px 14px; font-size:12.5px; margin-bottom:10px;}

  /* ★2026-09-24追加：管理者ログイン時だけの編集機能（README 59章） */
  .tab-btn.admin-only{border-style:dashed; color:#4A3F6B;}
  .tab-btn.admin-only.active{background:#4A3F6B; border-color:#4A3F6B; color:#fff;}
  .admin-note{background:#EFEDF3; color:#4A3F6B; border:1px solid #D9D5E2; border-radius:10px; padding:9px 14px; font-size:12px; margin-bottom:10px; line-height:1.6;}
  td.edit-cell{position:sticky; left:0; background:inherit; z-index:1;}
  .edit-btn{padding:3px 8px; border-radius:6px; border:1px solid #D9D5E2; background:#fff; color:#4A3F6B; font-size:12px; cursor:pointer; font-family:inherit;}
  .modal-bg{position:fixed; inset:0; background:rgba(0,0,0,0.35); display:none; align-items:center; justify-content:center; z-index:9000; padding:16px;}
  .modal-bg.open{display:flex;}
  .modal{background:#fff; border-radius:14px; width:100%; max-width:560px; max-height:88vh; overflow:auto; padding:20px 22px; box-shadow:0 10px 30px rgba(0,0,0,0.2);}
  .modal h3{font-size:15px; margin-bottom:4px;}
  .modal .sub{font-size:12px; color:var(--ink-soft); margin-bottom:14px;}
  .field{margin-bottom:10px;}
  .field label{display:block; font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:4px;}
  .field input, .field select, .field textarea{width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:13px; font-family:inherit;}
  .field textarea{min-height:70px; resize:vertical;}
  .field.changed input, .field.changed select, .field.changed textarea{border-color:#4A3F6B; background:#F7F5FB;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:14px;}
  .modal-actions button{padding:9px 16px; border-radius:8px; border:1px solid var(--line); background:#fff; font-size:13px; cursor:pointer; font-family:inherit;}
  .modal-actions .primary{background:#4A3F6B; color:#fff; border-color:#4A3F6B; font-weight:700;}
  .modal-err{display:none; background:#FDEDEA; color:var(--warn); border-radius:8px; padding:8px 12px; font-size:12.5px; margin-top:10px;}
  table.diff{width:100%; border-collapse:collapse; font-size:12.5px; margin-top:6px;}
  table.diff th, table.diff td{border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top; word-break:break-all;}
  table.diff td.old{color:var(--warn); text-decoration:line-through;}
  table.diff td.new{color:#2E6B3F; font-weight:700;}
  .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#2B2B27; color:#fff; padding:9px 16px; border-radius:8px; font-size:13px; z-index:9500; display:none;}
</style>
</head>
<body>
<div id="loadingMsg">読み込み中...</div>
<div class="wrap" id="wrap">
  <div class="page-head">
    <div>
      <h1 id="pageTitle">🗂️ DB一覧ビューア（閲覧専用）</h1>
      <p id="pageSub">店舗の全データをスプレットシートのように横断的に確認できます。編集はできません（変更は各管理画面から行ってください）。</p>
    </div>
    <div style="display:flex; gap:8px; align-items:center;">
      <span class="view-badge" id="viewBadge"></span>
      <button class="close-btn" onclick="location.href='/admin/index.html'">← 管理画面へ戻る</button>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="admin-note" id="adminNote" style="display:none;"></div>
  <div class="err-box" id="errBox" style="display:none;"></div>

  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="検索（対象カラム内をあいまい一致で検索）">
    <span class="count" id="countLabel"></span>
    <button id="reloadBtn">🔄 再読込</button>
  </div>

  <div class="grid-panel">
    <table class="gridtbl">
      <thead><tr id="theadRow"></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="pager">
    <button id="prevBtn">← 前へ</button>
    <span id="pageLabel"></span>
    <button id="nextBtn">次へ →</button>
  </div>
</div>

<!-- ★2026-09-24追加：管理者ログイン時の編集モーダル（①編集→②変更内容の確認→③保存の2段階） -->
<div class="modal-bg" id="editModal">
  <div class="modal">
    <div id="editStep">
      <h3 id="editTitle"></h3>
      <div class="sub">編集できる項目だけが表示されています（id・作成日時・紐付けキー・PIN・権限などは編集できません）。</div>
      <div id="editFields"></div>
      <div class="modal-err" id="editErr"></div>
      <div class="modal-actions">
        <button type="button" id="editCancelBtn">キャンセル</button>
        <button type="button" class="primary" id="editReviewBtn">変更内容を確認</button>
      </div>
    </div>
    <div id="confirmStep" style="display:none;">
      <h3>⚠️ この内容で保存しますか？</h3>
      <div class="sub" id="confirmSub"></div>
      <table class="diff"><thead><tr><th>カラム</th><th>変更前</th><th>変更後</th></tr></thead><tbody id="diffBody"></tbody></table>
      <div class="sub" style="margin-top:10px;">保存すると、変更前・変更後の値が「編集ログ」タブに記録されます。予約の重複チェックなど各管理画面の業務ルールは通らず、値がそのまま書き込まれます。</div>
      <div class="modal-err" id="confirmErr"></div>
      <div class="modal-actions">
        <button type="button" id="confirmBackBtn">← 戻って修正</button>
        <button type="button" class="primary" id="confirmSaveBtn">この内容で保存</button>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  const loadingMsg = document.getElementById('loadingMsg');
  const wrap = document.getElementById('wrap');
  const tabsEl = document.getElementById('tabs');
  const errBox = document.getElementById('errBox');
  const theadRow = document.getElementById('theadRow');
  const tbody = document.getElementById('tbody');
  const countLabel = document.getElementById('countLabel');
  const pageLabel = document.getElementById('pageLabel');
  const searchInput = document.getElementById('searchInput');

  let tables = [];
  let isAdmin = false;
  let currentRows = [];
  let editing = null; // { table, row, pending: { col: newValue } }
  let state = { table: null, sort: null, dir: 'DESC', q: '', offset: 0, limit: 100 };
  let searchDebounce = null;

  function esc(v) { return String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  async function adminFetch(url, opts) {
    const res = await fetch(url, opts);
    if (res.status === 401) throw new Error('UNAUTHORIZED');
    if (!res.ok) { let msg = 'サーバーエラー: ' + res.status; try { const b = await res.json(); if (b && (b.message||b.error)) msg = b.message||b.error; } catch (_) {} throw new Error(msg); }
    return res.json();
  }

  async function init() {
    try {
      const me = await adminFetch('/api/auth/me');
      if (!me.staff.isOwner || me.staff.isTerminal) {
        loadingMsg.textContent = 'この画面はオーナー権限のみ利用できます（サロン端末では利用できません）';
        return;
      }
      isAdmin = !!me.staff.isAdmin;
      document.getElementById('viewBadge').textContent = isAdmin ? '🛡️ 管理者' : '👤 ' + me.staff.name + '（オーナー）';
      if (isAdmin) {
        document.getElementById('pageTitle').textContent = '🗂️ DB一覧ビューア（管理者：編集可）';
        document.getElementById('pageSub').textContent = '管理者ログイン中のため、各行の「✏️」から許可された項目を編集できます。保存前に変更内容の確認があり、変更は「編集ログ」タブに記録されます。';
        document.title = 'DB一覧ビューア（管理者）';
      }
      const tdata = await adminFetch('/api/admin/db-viewer/tables');
      tables = tdata.tables;
      renderTabs();
      state.table = tables[0].key;
      await loadRows();
      loadingMsg.style.display = 'none';
      wrap.classList.add('ready');
    } catch (e) {
      if (e.message === 'UNAUTHORIZED') {
        window.location.href = '/admin/login.html?next=' + encodeURIComponent(window.location.pathname);
      } else {
        loadingMsg.textContent = '読み込みに失敗しました: ' + e.message;
      }
    }
  }

  function renderTabs() {
    tabsEl.innerHTML = tables.map(t =>
      `<button class="tab-btn${t.adminOnly ? ' admin-only' : ''}" data-key="${t.key}">${esc(t.label)}</button>`
    ).join('');
    tabsEl.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.table = btn.dataset.key;
        state.sort = null; state.dir = 'DESC'; state.offset = 0; state.q = '';
        searchInput.value = '';
        loadRows();
      });
    });
  }

  function currentTableDef() { return tables.find((t) => t.key === state.table) || {}; }

  function updateTabActive() {
    tabsEl.querySelectorAll('.tab-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.key === state.table);
    });
    const def = currentTableDef();
    const note = document.getElementById('adminNote');
    if (!isAdmin) { note.style.display = 'none'; return; }
    note.style.display = '';
    if (state.table === 'db_edit_log') note.textContent = '🛡️ DB一覧ビューアで行った編集の記録です（1カラム1行、閲覧専用。記録の編集・削除はできません）。';
    else if (state.table === 'webhook_log') note.textContent = '🛡️ LINE webhookで受信したイベントの記録です（閲覧専用）。スタッフのPIN送信は「****」にマスクしています。90日より古い記録は日次メンテナンスで自動削除されます。';
    else if (def.editable) note.textContent = '🛡️ 編集できる項目：' + Object.keys(def.editable).join('、');
    else note.textContent = '🛡️ このテーブルは閲覧専用です。';
  }

  async function loadRows() {
    updateTabActive();
    errBox.style.display = 'none';
    tbody.innerHTML = '<tr class="empty-row"><td colspan="20">読み込み中...</td></tr>';
    try {
      const qs = new URLSearchParams();
      if (state.sort) qs.set('sort', state.sort);
      if (state.dir) qs.set('dir', state.dir);
      if (state.q) qs.set('q', state.q);
      qs.set('limit', state.limit);
      qs.set('offset', state.offset);
      const data = await adminFetch(`/api/admin/db-viewer/${encodeURIComponent(state.table)}?${qs.toString()}`);
      state.sort = data.sort; state.dir = data.dir;
      renderHead(data.columns);
      renderRows(data.columns, data.rows);
      countLabel.textContent = `${data.total}件中 ${data.rows.length ? (data.offset + 1) : 0}〜${data.offset + data.rows.length}件を表示`;
      pageLabel.textContent = `${Math.floor(data.offset / data.limit) + 1}ページ / 全${Math.max(1, Math.ceil(data.total / data.limit))}ページ`;
      document.getElementById('prevBtn').disabled = data.offset <= 0;
      document.getElementById('nextBtn').disabled = data.offset + data.rows.length >= data.total;
    } catch (e) {
      errBox.textContent = '取得に失敗しました: ' + e.message;
      errBox.style.display = 'block';
      tbody.innerHTML = '';
    }
  }

  function renderHead(columns) {
    const editCol = isAdmin && currentTableDef().editable ? '<th style="cursor:default;">編集</th>' : '';
    theadRow.innerHTML = editCol + columns.map(c => {
      const isSorted = c === state.sort;
      const arrow = isSorted ? (state.dir === 'ASC' ? '▲' : '▼') : '';
      return `<th data-col="${esc(c)}">${esc(c)}<span class="arrow">${arrow}</span></th>`;
    }).join('');
    theadRow.querySelectorAll('th[data-col]').forEach(th => {
      th.addEventListener('click', () => {
        const col = th.dataset.col;
        if (state.sort === col) {
          state.dir = state.dir === 'ASC' ? 'DESC' : 'ASC';
        } else {
          state.sort = col; state.dir = 'ASC';
        }
        state.offset = 0;
        loadRows();
      });
    });
  }

  function renderRows(columns, rows) {
    currentRows = rows;
    const editable = isAdmin && currentTableDef().editable;
    if (!rows.length) {
      tbody.innerHTML = `<tr class="empty-row"><td colspan="${columns.length + (editable ? 1 : 0)}">データがありません</td></tr>`;
      return;
    }
    tbody.innerHTML = rows.map((r, i) =>
      '<tr>' + (editable ? `<td class="edit-cell"><button class="edit-btn" data-idx="${i}" type="button">✏️</button></td>` : '') +
      columns.map(c => `<td title="${esc(r[c])}">${esc(r[c])}</td>`).join('') + '</tr>'
    ).join('');
    tbody.querySelectorAll('.edit-btn').forEach((btn) => {
      btn.addEventListener('click', () => openEdit(currentRows[Number(btn.dataset.idx)]));
    });
  }

  // ---------- ★2026-09-24追加：管理者の編集（①編集→②確認→③保存） ----------
  const LONG_TEXT = ['note', 'memo', 'body', 'closing', 'text', 'address'];
  function valText(v) { return v == null ? '' : String(v); }
  function inputFor(col, spec, value) {
    const v = valText(value);
    if (spec.type === 'bool') {
      return `<select data-col="${esc(col)}"><option value="1"${v === '1' ? ' selected' : ''}>1（はい）</option><option value="0"${v !== '1' ? ' selected' : ''}>0（いいえ）</option></select>`;
    }
    if (spec.type === 'enum') {
      const opts = spec.options.includes(v) ? spec.options : [v].concat(spec.options);
      return `<select data-col="${esc(col)}">` + opts.map((o) => `<option value="${esc(o)}"${o === v ? ' selected' : ''}>${esc(o)}</option>`).join('') + '</select>';
    }
    if (spec.type === 'date') return `<input type="date" data-col="${esc(col)}" value="${esc(v)}">`;
    if (spec.type === 'time') return `<input type="time" data-col="${esc(col)}" value="${esc(v)}">`;
    if (spec.type === 'int') return `<input type="number" step="1"${spec.min != null ? ` min="${spec.min}"` : ''} data-col="${esc(col)}" value="${esc(v)}">`;
    if (LONG_TEXT.includes(col)) return `<textarea data-col="${esc(col)}">${esc(v)}</textarea>`;
    return `<input type="text" data-col="${esc(col)}" value="${esc(v)}">`;
  }
  function openEdit(row) {
    const def = currentTableDef();
    editing = { table: state.table, row, pending: {} };
    document.getElementById('editTitle').textContent = `✏️ ${def.label}　id=${row.id} を編集`;
    document.getElementById('editFields').innerHTML = Object.entries(def.editable).map(([col, spec]) =>
      `<div class="field" data-field="${esc(col)}"><label>${esc(col)}${spec.required ? '（必須）' : ''}</label>${inputFor(col, spec, row[col])}</div>`
    ).join('');
    document.querySelectorAll('#editFields [data-col]').forEach((el) => {
      el.addEventListener('input', () => {
        el.closest('.field').classList.toggle('changed', el.value !== valText(row[el.dataset.col]));
      });
    });
    document.getElementById('editErr').style.display = 'none';
    document.getElementById('editStep').style.display = '';
    document.getElementById('confirmStep').style.display = 'none';
    document.getElementById('editModal').classList.add('open');
  }
  function closeEdit() { document.getElementById('editModal').classList.remove('open'); editing = null; }
  function showModalErr(id, msg) { const el = document.getElementById(id); el.textContent = msg; el.style.display = 'block'; }

  document.getElementById('editCancelBtn').addEventListener('click', closeEdit);
  document.getElementById('editReviewBtn').addEventListener('click', () => {
    const row = editing.row;
    const pending = {};
    document.querySelectorAll('#editFields [data-col]').forEach((el) => {
      if (el.value !== valText(row[el.dataset.col])) pending[el.dataset.col] = el.value;
    });
    if (!Object.keys(pending).length) { showModalErr('editErr', '変更された項目がありません'); return; }
    editing.pending = pending;
    document.getElementById('confirmSub').textContent = `${currentTableDef().label}　id=${row.id}　／　${Object.keys(pending).length}項目を変更します`;
    document.getElementById('diffBody').innerHTML = Object.entries(pending).map(([col, nv]) =>
      `<tr><td>${esc(col)}</td><td class="old">${esc(valText(row[col])) || '（空）'}</td><td class="new">${esc(nv) || '（空）'}</td></tr>`
    ).join('');
    document.getElementById('confirmErr').style.display = 'none';
    document.getElementById('editStep').style.display = 'none';
    document.getElementById('confirmStep').style.display = '';
  });
  document.getElementById('confirmBackBtn').addEventListener('click', () => {
    document.getElementById('confirmStep').style.display = 'none';
    document.getElementById('editStep').style.display = '';
  });
  document.getElementById('confirmSaveBtn').addEventListener('click', async () => {
    const btn = document.getElementById('confirmSaveBtn');
    const expected = {};
    Object.keys(editing.pending).forEach((c) => { expected[c] = editing.row[c]; });
    btn.disabled = true;
    try {
      const res = await fetch(`/api/admin/db-viewer/${encodeURIComponent(editing.table)}/${editing.row.id}`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ changes: editing.pending, expected })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.success) { showModalErr('confirmErr', data.message || data.error || ('保存に失敗しました: ' + res.status)); return; }
      closeEdit();
      const toast = document.getElementById('toast');
      toast.textContent = `✅ ${data.changed.length}項目を保存し、編集ログに記録しました`;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2500);
      loadRows();
    } catch (e) {
      showModalErr('confirmErr', 'サーバーエラー: ' + e.message);
    } finally {
      btn.disabled = false;
    }
  });

  searchInput.addEventListener('input', () => {
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(() => {
      state.q = searchInput.value.trim();
      state.offset = 0;
      loadRows();
    }, 300);
  });

  document.getElementById('reloadBtn').addEventListener('click', loadRows);
  document.getElementById('prevBtn').addEventListener('click', () => {
    state.offset = Math.max(0, state.offset - state.limit);
    loadRows();
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    state.offset += state.limit;
    loadRows();
  });

  init();
})();
</script>
