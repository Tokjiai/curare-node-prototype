<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>オーナー管理画面 - 顧客マスタ</title>
<style>
  :root{
    --bg:#F5F4EF; --panel:#ffffff; --ink:#2B2B27; --ink-soft:#75746C; --ink-faint:#A9A79C;
    --line:#E4E2D9; --accent:#3D6B5C; --accent-soft:#E7EFE9; --warn:#B3542E; --warn-soft:#F7E9E2;
    --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0; font-family:'Hiragino Sans','Yu Gothic',sans-serif;}
  body{background:var(--bg); color:var(--ink);}
  .shell{display:none; min-height:100vh;}
  .shell.ready{display:grid; grid-template-columns:220px 1fr;}

  .sidebar{background:var(--panel); border-right:1px solid var(--line); padding:20px 14px; display:flex; flex-direction:column; gap:16px;}
  .brand{font-size:14px; font-weight:600; padding:0 8px;}
  .store-name{background:var(--accent-soft); color:var(--accent); border-radius:8px; padding:9px 10px; font-size:13px; font-weight:700; text-align:center;}
  .proto-badge{font-size:10.5px; color:var(--warn); background:var(--warn-soft); border-radius:8px; padding:6px 8px; text-align:center; font-weight:700;}
  .nav{display:flex; flex-direction:column; gap:2px;}
  .nav-item{display:flex; align-items:center; gap:10px; padding:10px 10px; border-radius:8px; text-decoration:none; font-size:13.5px; color:var(--ink-soft); font-weight:500;}
  .nav-item.active{background:var(--accent-soft); color:var(--accent);}
  .nav-item.warn{color:var(--warn); margin-top:auto;}

  .main{padding:28px 32px; max-width:1000px;}
  .page-head{margin-bottom:20px;}
  .page-head h1{font-size:19px; font-weight:600; margin-bottom:4px;}
  .page-head p{font-size:13px; color:var(--ink-soft);}

  .panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; margin-bottom:16px;}
  .panel h2{font-size:14px; font-weight:600; margin-bottom:14px; color:var(--ink);}

  .cm-search{display:flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:8px 12px; max-width:420px;}
  .cm-search input{border:none; font-size:13.5px; width:100%; outline:none; font-family:inherit;}
  .search-row{display:flex; gap:8px; margin-bottom:6px;}
  .search-row .cm-search{flex:1;}
  .btn-save{background:var(--accent); color:#fff; border:none; border-radius:9px; padding:10px 20px; font-size:13px; font-weight:600; cursor:pointer; flex-shrink:0;}

  table{width:100%; border-collapse:collapse; margin-top:14px; font-size:13px;}
  th{text-align:left; font-size:11px; color:var(--ink-soft); font-weight:600; padding:8px 6px; border-bottom:1px solid var(--line); white-space:nowrap;}
  td{padding:9px 6px; border-bottom:1px solid #F1ECE9; vertical-align:middle; white-space:nowrap;}
  tr:last-child td{border-bottom:none;}
  td.memo{white-space:normal; max-width:220px; color:var(--ink-soft);}

  .pager{display:flex; justify-content:space-between; align-items:center; margin-top:12px; font-size:13px;}
  .pager button{padding:7px 14px; border:1px solid var(--line); border-radius:8px; background:#fff; cursor:pointer; font-family:inherit;}
  .pager button:disabled{opacity:0.4; cursor:not-allowed;}

  .err{color:var(--warn); font-size:13px; margin-top:8px;}
  .hint{font-size:11px; color:var(--ink-soft); margin-top:10px;}
  #loadingMsg{text-align:center; color:var(--ink-soft); font-size:13px; padding:60px 0;}
  .empty{color:var(--ink-soft); font-size:13px; padding:14px 0; text-align:center;}

  .merge-panel{background:var(--warn-soft); border-color:transparent;}
  .merge-panel h2{color:var(--warn);}
  .merge-item{background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px;}
  .merge-item .pair{display:flex; gap:14px; flex-wrap:wrap; font-size:13px; margin-bottom:10px;}
  .merge-card{flex:1; min-width:180px; background:var(--bg); border-radius:8px; padding:8px 10px;}
  .merge-card .cid{font-size:11px; color:var(--ink-faint); font-weight:700;}
  .merge-card .rn{font-weight:600; margin:2px 0;}
  .merge-card .sub{font-size:12px; color:var(--ink-soft);}
  .merge-actions{display:flex; gap:8px; align-items:center;}
  .merge-actions button{padding:7px 12px; border-radius:8px; border:1px solid var(--line); background:#fff; font-size:12.5px; cursor:pointer; font-family:inherit;}
  .merge-actions .btn-merge{background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600;}
  .merge-actions .keep-label{font-size:12px; color:var(--ink-soft);}
  .merge-actions select{padding:6px 8px; border-radius:8px; border:1px solid var(--line); font-family:inherit; font-size:12.5px;}

  @media (max-width:760px){
    .shell.ready{grid-template-columns:1fr;}
    .sidebar{flex-direction:row; flex-wrap:wrap; align-items:center; padding:12px 14px;}
    .brand{display:none;}
    .nav{flex-direction:row; flex-wrap:wrap; gap:6px;}
    .nav-item.warn{margin-top:0;}
    .main{padding:18px 16px;}
  }
</style>
</head>
<body>
  <div id="loadingMsg">読み込み中...</div>

  <div class="shell" id="shell">
    <div class="sidebar">
      <div class="brand">クラーレ寿 ／ オーナー管理</div>
      <div class="store-name">クラーレ寿</div>
      <div class="proto-badge">PROTOTYPE</div>
      <div class="nav">
        <a href="index.html" class="nav-item">📊 ダッシュボード</a>
        <a href="customers.html" class="nav-item active">👥 顧客マスタ</a>
        <a href="reservations.html" class="nav-item">📅 予約データ</a>
        <a href="shifts.html" class="nav-item">🗓️ シフト管理</a>
        <a href="staff.html" class="nav-item">🧑‍🤝‍🧑 スタッフ管理</a>
        <a href="../index.html" class="nav-item">🔗 予約画面へ</a>
        <a href="#" id="logoutLink" class="nav-item warn">🚪 ログアウト</a>
      </div>
    </div>

    <div class="main">
      <div class="page-head">
        <h1>顧客マスタ</h1>
        <p>氏名・フリガナ・電話番号で検索できます</p>
      </div>

      <div class="panel merge-panel" id="mergePanel" style="display:none;">
        <h2>⚠️ 重複の可能性がある顧客</h2>
        <p style="font-size:12.5px; color:var(--ink-soft); margin-bottom:10px;">電話番号が同じなのに顧客IDが異なる組み合わせです。同一人物なら「統合する」、別人なら「別人として見送る」を選んでください。</p>
        <div id="mergeList"></div>
      </div>

      <div class="panel">
        <h2>検索</h2>
        <div class="search-row">
          <div class="cm-search"><input type="text" id="qInput" placeholder="例：田中 / タナカ / 090"></div>
          <button class="btn-save" id="searchBtn" type="button">検索</button>
        </div>

        <table>
          <thead>
            <tr>
              <th>顧客ID</th><th>氏名</th><th>フリガナ</th><th>電話番号</th>
              <th>最終来店日</th><th>来店回数</th><th>メモ</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
        <div class="empty" id="emptyMsg" style="display:none;">該当する顧客がいません</div>

        <div class="pager">
          <button id="prevBtn" type="button">← 前へ</button>
          <span id="pageLabel"></span>
          <button id="nextBtn" type="button">次へ →</button>
        </div>
      </div>
    </div>
  </div>

<script>
(function(){
  const limit = 50;
  let offset = 0;
  let total = 0;

  const loadingMsg = document.getElementById('loadingMsg');
  const shell = document.getElementById('shell');

  async function adminFetch(url, opts) {
    const res = await fetch(url, opts);
    if (res.status === 401) throw new Error('UNAUTHORIZED');
    if (!res.ok) {
      let msg = 'サーバーエラー: ' + res.status;
      try { const body = await res.json(); if (body && body.message) msg = body.message; } catch (_) {}
      throw new Error(msg);
    }
    return res.json();
  }

  async function init() {
    try {
      await adminFetch('/api/auth/me');
      await load();
      await loadMergeCandidates();
      loadingMsg.style.display = 'none';
      shell.classList.add('ready');
    } catch (e) {
      window.location.href = '/admin/login.html';
    }
  }

  async function loadMergeCandidates() {
    const data = await adminFetch('/api/admin/customers/merge-candidates');
    const panel = document.getElementById('mergePanel');
    const list = document.getElementById('mergeList');
    const candidates = data.candidates || [];
    if (candidates.length === 0) {
      panel.style.display = 'none';
      return;
    }
    panel.style.display = 'block';
    list.innerHTML = '';
    candidates.forEach((c) => {
      const div = document.createElement('div');
      div.className = 'merge-item';
      const idA = c.customerA.customer_id, idB = c.customerB.customer_id;
      div.innerHTML = `
        <div class="pair">
          <div class="merge-card">
            <div class="cid">${esc(idA)}</div>
            <div class="rn">${esc(c.customerA.realname)}</div>
            <div class="sub">${esc(c.customerA.kana || '')} ／ ${esc(c.customerA.phone || '')}</div>
          </div>
          <div class="merge-card">
            <div class="cid">${esc(idB)}</div>
            <div class="rn">${esc(c.customerB.realname)}</div>
            <div class="sub">${esc(c.customerB.kana || '')} ／ ${esc(c.customerB.phone || '')}</div>
          </div>
        </div>
        <div class="merge-actions">
          <span class="keep-label">どちらを残す？</span>
          <select class="keepSelect">
            <option value="${esc(idA)}">${esc(idA)}（${esc(c.customerA.realname)}）を残す</option>
            <option value="${esc(idB)}">${esc(idB)}（${esc(c.customerB.realname)}）を残す</option>
          </select>
          <button type="button" class="btn-merge" data-a="${esc(idA)}" data-b="${esc(idB)}">統合する</button>
          <button type="button" class="btn-dismiss" data-a="${esc(idA)}" data-b="${esc(idB)}">別人として見送る</button>
        </div>
      `;
      div.querySelector('.btn-merge').addEventListener('click', async (e) => {
        const keep = div.querySelector('.keepSelect').value;
        const mergeId = keep === idA ? idB : idA;
        if (!confirm(`${mergeId} を ${keep} に統合します。よろしいですか？`)) return;
        try {
          await adminFetch('/api/admin/customers/merge', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ keepCustomerId: keep, mergeCustomerId: mergeId })
          });
          await load();
          await loadMergeCandidates();
        } catch (err) { alert(err.message); }
      });
      div.querySelector('.btn-dismiss').addEventListener('click', async () => {
        try {
          await adminFetch('/api/admin/customers/merge-candidates/dismiss', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ customerIdA: idA, customerIdB: idB })
          });
          await loadMergeCandidates();
        } catch (err) { alert(err.message); }
      });
      list.appendChild(div);
    });
  }

  document.getElementById('logoutLink').addEventListener('click', async (e) => {
    e.preventDefault();
    try { await fetch('/api/auth/logout', { method: 'POST' }); } catch (_) {}
    window.location.href = '/admin/login.html';
  });

  async function load() {
    const q = document.getElementById('qInput') ? document.getElementById('qInput').value.trim() : '';
    // ★storeパラメータは廃止：サーバー側でセッションの店舗に固定される
    const params = new URLSearchParams({ limit, offset });
    if (q) params.set('q', q);
    const data = await adminFetch('/api/admin/customers?' + params.toString());
    total = data.total;
    render(data.customers);
  }

  function render(rows) {
    const tbody = document.getElementById('tbody');
    tbody.innerHTML = '';
    document.getElementById('emptyMsg').style.display = rows.length === 0 ? 'block' : 'none';
    rows.forEach((c) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${esc(c.customer_id)}</td>
        <td>${esc(c.realname)}</td>
        <td>${esc(c.kana || '')}</td>
        <td>${esc(c.phone || '')}</td>
        <td>${esc(c.last_visit_date || '')}</td>
        <td>${esc(c.total_visits)}</td>
        <td class="memo">${esc(c.memo || '')}</td>
      `;
      tbody.appendChild(tr);
    });
    const page = Math.floor(offset / limit) + 1;
    const maxPage = Math.max(1, Math.ceil(total / limit));
    document.getElementById('pageLabel').textContent = `${page} / ${maxPage} ページ（全${total}件）`;
    document.getElementById('prevBtn').disabled = offset <= 0;
    document.getElementById('nextBtn').disabled = offset + limit >= total;
  }

  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }

  document.getElementById('searchBtn').addEventListener('click', () => { offset = 0; load(); });
  document.getElementById('qInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { offset = 0; load(); }
  });
  document.getElementById('prevBtn').addEventListener('click', () => { offset = Math.max(0, offset - limit); load(); });
  document.getElementById('nextBtn').addEventListener('click', () => { offset = offset + limit; load(); });

  init();
})();
</script>
</body>
</html>
